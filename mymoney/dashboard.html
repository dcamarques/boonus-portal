<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Painel - My Money</title>
    
    <!-- Supabase JS Client Oficial -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --surface-hover: #334155;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #2563eb;     /* Azul Institucional */
            --success: #10b981;     /* Verde */
            --danger: #ef4444;      /* Vermelho */
            --warning: #f59e0b;
            --info: #0ea5e9;
            --radius: 12px;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color); color: var(--text-primary);
            min-height: 100dvh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            display: flex; flex-direction: column; align-items: center;
        }

        .container {
            width: 100%; max-width: 800px; padding: 1.5rem; padding-bottom: 7rem;
        }

        /* HEADER E CONTROLES */
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem;
        }

        .user-info h1 { font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 8px;}
        .user-info p { font-size: 0.85rem; color: var(--text-secondary); }

        .btn-outline {
            background: transparent; border: 1px solid var(--border-color);
            color: var(--text-primary); padding: 0.5rem 1rem; border-radius: 8px;
            cursor: pointer; font-size: 0.85rem; transition: background 0.2s;
        }

        .controls-row {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface-color); padding: 0.5rem; border-radius: var(--radius);
            margin-bottom: 1rem; border: 1px solid var(--border-color);
        }

        .month-nav { display: flex; align-items: center; gap: 1rem; }
        .month-nav button { background: none; border: none; color: var(--text-primary); font-size: 1.2rem; cursor: pointer; padding: 0.5rem; }
        .month-label { font-weight: 600; font-size: 1rem; min-width: 120px; text-align: center; text-transform: capitalize;}

        .view-toggle { display: flex; background: var(--bg-color); border-radius: 8px; overflow: hidden; }
        .view-btn { background: transparent; border: none; color: var(--text-secondary); padding: 0.5rem 1rem; font-size: 0.85rem; cursor: pointer; transition: 0.3s; }
        .view-btn.active { background: var(--primary); color: white; font-weight: 600; }

        /* LINHA DO FILTRO DE SALDO */
        .balance-filter-row {
            display: flex; justify-content: flex-end; margin-bottom: 1.5rem;
        }
        .balance-toggle {
            display: flex; background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: 8px; overflow: hidden;
        }
        .balance-btn {
            background: transparent; border: none; color: var(--text-secondary);
            padding: 0.4rem 0.8rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .balance-btn.active { background: var(--text-secondary); color: var(--bg-color); }

        /* CARDS RESUMO */
        .summary-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem; margin-bottom: 2rem;
        }
        .summary-card {
            background: var(--surface-color); padding: 1.25rem;
            border-radius: var(--radius); border: 1px solid var(--border-color);
        }
        .summary-title { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
        .summary-value { font-size: 1.5rem; font-weight: 700; transition: color 0.3s ease; }
        
        /* TRANSAÇÕES E AÇÕES */
        .section-header { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; }
        .transaction-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .transaction-item {
            background: var(--surface-color); padding: 1rem; border-radius: var(--radius);
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--border-color); gap: 10px;
        }
        .t-info { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; }
        .t-desc { font-weight: 600; font-size: 0.95rem; line-height: 1.2; }
        .t-cat { font-size: 0.8rem; color: var(--text-secondary); display: flex; gap: 6px; align-items: center;}
        
        .t-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .t-amount { font-weight: 600; font-size: 1.05rem; }
        
        .t-actions { display: flex; gap: 12px; }
        .action-btn { 
            background: var(--bg-color); border: 1px solid var(--border-color); 
            border-radius: 6px; padding: 0.4rem; cursor: pointer; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .action-btn:active { transform: scale(0.9); }
        
        /* CORES DINÂMICAS E DE TEXTO */
        .text-primary { color: var(--primary); }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-info { color: var(--info); }

        /* FAB */
        .fab {
            position: fixed; bottom: max(2rem, env(safe-area-inset-bottom));
            right: 50%; transform: translateX(50%);
            background-color: var(--primary); color: white; border: none;
            border-radius: 50px; padding: 1rem 2rem; font-size: 1rem; font-weight: 600;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); cursor: pointer; z-index: 100;
        }
        @media (min-width: 800px) { .fab { right: calc(50% - 360px); transform: none; } }

        /* MODAL INTELIGENTE */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: flex-end;
            z-index: 1000; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: var(--surface-color); width: 100%; max-width: 500px;
            padding: 2rem; border-radius: 20px 20px 0 0;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        @media (min-width: 600px) { .modal-overlay { align-items: center; } .modal-content { border-radius: var(--radius); } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .btn-close { background: none; border: none; color: var(--text-secondary); font-size: 1.75rem; cursor: pointer; }

        .type-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 1.5rem; }
        .type-btn {
            padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-color); color: var(--text-secondary);
            font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 0.85rem;
        }
        .type-btn.active { border-color: var(--primary); color: white; background: var(--primary); }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-secondary); }
        .form-group input, .form-group select {
            width: 100%; padding: 0.85rem; background: var(--bg-color); border: 1px solid var(--border-color);
            border-radius: 8px; color: var(--text-primary); font-size: 16px; outline: none; -webkit-appearance: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
        
        .btn-save {
            width: 100%; padding: 1rem; border: none; border-radius: 8px;
            background: var(--primary); color: white; font-size: 16px; font-weight: 600;
            cursor: pointer; margin-top: 1rem;
        }

        .hidden-field { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="user-info">
                <h1>💰 My Money</h1>
                <p id="user-email">Carregando...</p>
            </div>
            <button class="btn-outline" onclick="handleLogout()">Sair</button>
        </header>

        <!-- CONTROLES MÊS / PERFIL -->
        <div class="controls-row">
            <div class="month-nav">
                <button onclick="changeMonth(-1)">&#10094;</button>
                <div class="month-label" id="month-display">Setembro 2026</div>
                <button onclick="changeMonth(1)">&#10095;</button>
            </div>
            <div class="view-toggle">
                <button class="view-btn active" id="btn-view-individual" onclick="setView('individual')">Meu Perfil</button>
                <button class="view-btn" id="btn-view-familia" onclick="setView('familia')">Família</button>
            </div>
        </div>

        <!-- FILTRO DE CÁLCULO DE SALDO -->
        <div class="balance-filter-row">
            <div class="balance-toggle">
                <button class="balance-btn active" id="btn-bal-acumulado" onclick="setBalanceMode('acumulado')">Saldo Acumulado</button>
                <button class="balance-btn" id="btn-bal-mes" onclick="setBalanceMode('mes')">Fluxo do Mês</button>
            </div>
        </div>

        <!-- RESUMO -->
        <div class="summary-grid">
            <div class="summary-card">
                <div class="summary-title" id="lbl-saldo-corrente">Saldo em Contas</div>
                <div class="summary-value" id="saldo-corrente">R$ 0,00</div>
            </div>
            <div class="summary-card">
                <div class="summary-title">Fatura Cartões (Mês)</div>
                <div class="summary-value text-danger" id="fatura-cartao">R$ 0,00</div>
            </div>
            <div class="summary-card">
                <div class="summary-title" id="lbl-saldo-invest">Total Investido</div>
                <div class="summary-value" id="saldo-investimento">R$ 0,00</div>
            </div>
        </div>

        <!-- LISTA -->
        <h2 class="section-header">Movimentações do Mês</h2>
        <div class="transaction-list" id="transaction-list">
            <div class="transaction-item" style="justify-content: center;"><span class="t-cat">Carregando dados...</span></div>
        </div>
    </div>

    <!-- BOTÃO FLUTUANTE -->
    <button class="fab" onclick="openModal()"><span>+</span> Lançamento</button>

    <!-- MODAL INTELIGENTE (CRIAR E EDITAR) -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Novo Lançamento</h2>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            
            <input type="hidden" id="trans-id" value="">

            <div class="type-selector">
                <button class="type-btn active" data-type="despesa" onclick="setTransType('despesa')">Despesa</button>
                <button class="type-btn" data-type="receita" onclick="setTransType('receita')">Receita</button>
                <button class="type-btn" data-type="transferencia" onclick="setTransType('transferencia')">Transferência / Investimento</button>
                <button class="type-btn" data-type="rendimento" onclick="setTransType('rendimento')">Rendimento</button>
            </div>

            <form id="form-transaction" onsubmit="saveTransaction(event)">
                <input type="hidden" id="trans-type" value="despesa">
                
                <div class="form-group">
                    <label>Valor (R$)</label>
                    <input type="number" id="trans-value" step="0.01" required placeholder="0,00">
                </div>
                
                <div class="form-group">
                    <label>Descrição</label>
                    <input type="text" id="trans-desc" required placeholder="Ex: Conta de Luz, Aporte CDB...">
                </div>

                <div class="form-group" id="grp-origem">
                    <label id="lbl-origem">Meio de Pagamento / Conta</label>
                    <select id="trans-origem" required>
                        <option value="">Selecione...</option>
                    </select>
                </div>

                <div class="form-group hidden-field" id="grp-destino">
                    <label>Conta/Investimento de Destino</label>
                    <select id="trans-destino">
                        <option value="">Selecione o destino...</option>
                    </select>
                </div>

                <div class="form-group" id="grp-categoria">
                    <label>Categoria</label>
                    <select id="trans-cat">
                        <option value="">Selecione...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Data</label>
                    <input type="date" id="trans-date" required>
                </div>

                <button type="submit" class="btn-save" id="btn-submit">Salvar</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kafmnasrqcmbzvzaggap.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_k4w2E4ur7xJR6qd575inBA_sJoXqHoN';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentFamilyId = null;
        
        let currentDate = new Date(); 
        let currentView = 'individual'; 
        let balanceMode = 'acumulado'; // Pode ser 'acumulado' ou 'mes'
        
        let carteiras = [];
        let categorias = [];
        let currentMonthTransactions = [];

        async function init() {
            const { data: { session } } = await client.auth.getSession();
            if (!session) { window.location.replace('index.html'); return; }
            currentUser = session.user;
            document.getElementById('user-email').innerText = currentUser.email;

            const { data: membros } = await client.from('MM_membros').select('familia_id').eq('user_id', currentUser.id).single();
            if(membros) {
                currentFamilyId = membros.familia_id;
                await loadBaseData();
                updateMonthDisplay();
                loadTransactions();
            } else {
                alert("Família não localizada. Execute o Script SQL de Carga Inicial.");
            }
        }

        async function handleLogout() {
            await client.auth.signOut();
            window.location.replace('index.html');
        }

        async function loadBaseData() {
            const { data: carts } = await client.from('MM_carteiras').select('*').eq('ativo', true);
            carteiras = carts || [];
            const { data: cats } = await client.from('MM_categorias').select('*');
            categorias = cats || [];
            populateSelects();
        }

        function populateSelects() {
            const selOrigem = document.getElementById('trans-origem');
            const selDestino = document.getElementById('trans-destino');
            const selCat = document.getElementById('trans-cat');
            
            selOrigem.innerHTML = '<option value="">Selecione...</option>';
            selDestino.innerHTML = '<option value="">Selecione...</option>';
            carteiras.forEach(c => {
                selOrigem.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
                selDestino.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
            });
            selCat.innerHTML = '<option value="">Selecione...</option>';
            categorias.forEach(c => { selCat.innerHTML += `<option value="${c.id}">${c.nome}</option>`; });
        }

        const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        
        function updateMonthDisplay() {
            document.getElementById('month-display').innerText = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            updateMonthDisplay();
            loadTransactions();
        }

        function setView(viewType) {
            currentView = viewType;
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-view-${viewType}`).classList.add('active');
            loadTransactions();
        }

        function setBalanceMode(mode) {
            balanceMode = mode;
            document.querySelectorAll('.balance-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-bal-${mode}`).classList.add('active');
            
            // Ajusta os rótulos
            document.getElementById('lbl-saldo-corrente').innerText = mode === 'acumulado' ? 'Saldo Real em Contas' : 'Fluxo Corrente (Mês)';
            document.getElementById('lbl-saldo-invest').innerText = mode === 'acumulado' ? 'Total Investido (Acumulado)' : 'Aportes/Rendimentos (Mês)';
            
            loadTransactions();
        }

        async function loadTransactions() {
            const listEl = document.getElementById('transaction-list');
            listEl.innerHTML = '<div class="transaction-item" style="justify-content: center;"><span class="t-cat">Atualizando dados...</span></div>';

            const compStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2, '0')}`;
            
            // 1. Busca as transações do Mês (Para montar a lista e calcular fatura do cartão)
            let queryMes = client.from('MM_transacoes').select('*, MM_categorias(nome, cor), MM_carteiras!carteira_origem_id(nome)').eq('competencia', compStr).order('data_transacao', { ascending: false });
            
            if (currentView === 'individual') {
                queryMes = queryMes.eq('lancado_por', currentUser.id);
            }

            const resMes = await queryMes;
            if (resMes.error) {
                listEl.innerHTML = `<div class="transaction-item"><span class="text-danger">Erro ao carregar dados.</span></div>`; return;
            }

            currentMonthTransactions = resMes.data;

            // 2. Lógica Inteligente para o Cálculo de Saldo (Mês vs Acumulado)
            let transacoesParaCalculo = [];

            if (balanceMode === 'acumulado') {
                // Se for acumulado, busca tudo desde o início dos tempos até o último dia do mês visualizado
                const ultimoDiaDoMes = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).toISOString().split('T')[0];
                let queryGlobal = client.from('MM_transacoes')
                    .select('valor, tipo, carteira_origem_id, carteira_destino_id')
                    .lte('data_transacao', ultimoDiaDoMes);
                
                if (currentView === 'individual') queryGlobal = queryGlobal.eq('lancado_por', currentUser.id);
                
                const resGlobal = await queryGlobal;
                if (!resGlobal.error) transacoesParaCalculo = resGlobal.data;
            } else {
                // Se for Visão Mês, o cálculo usa estritamente os dados que já baixamos no resMes
                transacoesParaCalculo = resMes.data;
            }

            // ==========================================
            // MOTOR DE CÁLCULO DE SALDOS E CORES
            // ==========================================
            let saldoCorrente = 0; let saldoInvestimento = 0; let faturaCartaoMes = 0;
            const carteiraTipos = {}; carteiras.forEach(c => carteiraTipos[c.id] = c.tipo);

            // Calcula Saldo Corrente e Investimentos
            transacoesParaCalculo.forEach(t => {
                const v = parseFloat(t.valor);
                const tipoOrigem = carteiraTipos[t.carteira_origem_id];
                const tipoDestino = t.carteira_destino_id ? carteiraTipos[t.carteira_destino_id] : null;

                if (t.tipo === 'receita') {
                    if (tipoOrigem === 'corrente') saldoCorrente += v;
                    if (tipoOrigem === 'investimento') saldoInvestimento += v;
                } else if (t.tipo === 'despesa') {
                    if (tipoOrigem === 'corrente') saldoCorrente -= v;
                } else if (t.tipo === 'transferencia') {
                    if (tipoOrigem === 'corrente') saldoCorrente -= v;
                    if (tipoOrigem === 'investimento') saldoInvestimento -= v;
                    if (tipoDestino === 'corrente') saldoCorrente += v;
                    if (tipoDestino === 'investimento') saldoInvestimento += v;
                } else if (t.tipo === 'rendimento') {
                    if (tipoOrigem === 'investimento') saldoInvestimento += v;
                }
            });

            // Fatura do Cartão é SEMPRE calculada apenas no mês visualizado (não existe fatura "acumulada")
            resMes.data.forEach(t => {
                const v = parseFloat(t.valor);
                if (t.tipo === 'despesa' && carteiraTipos[t.carteira_origem_id] === 'cartao_credito') faturaCartaoMes += v;
            });

            // Aplica Cores Dinâmicas (Azul se positivo/zero, Vermelho se negativo)
            const elSaldoCorrente = document.getElementById('saldo-corrente');
            const elSaldoInvest = document.getElementById('saldo-investimento');

            elSaldoCorrente.className = 'summary-value ' + (saldoCorrente >= 0 ? 'text-primary' : 'text-danger');
            elSaldoInvest.className = 'summary-value ' + (saldoInvestimento >= 0 ? 'text-primary' : 'text-danger');

            elSaldoCorrente.innerText = `R$ ${saldoCorrente.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            elSaldoInvest.innerText = `R$ ${saldoInvestimento.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('fatura-cartao').innerText = `R$ ${faturaCartaoMes.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;


            // ==========================================
            // RENDERIZAÇÃO DA LISTA
            // ==========================================
            if (resMes.data.length === 0) {
                listEl.innerHTML = '<div class="transaction-item" style="justify-content: center;"><span class="t-cat">Nenhum lançamento neste mês.</span></div>';
                return;
            }

            listEl.innerHTML = '';
            resMes.data.forEach(t => {
                let icon = '💵'; let amountClass = 'text-primary'; let sign = '';
                if (t.tipo === 'despesa') { icon = '🛒'; amountClass = 'text-danger'; sign = '-'; }
                if (t.tipo === 'receita') { icon = '📈'; amountClass = 'text-success'; sign = '+'; }
                if (t.tipo === 'transferencia') { icon = '🔄'; amountClass = 'text-info'; }
                if (t.tipo === 'rendimento') { icon = '✨'; amountClass = 'text-success'; sign = '+'; }

                const dataFormatada = new Date(t.data_transacao).toLocaleDateString('pt-BR', {timeZone: 'UTC'});
                const catInfo = t.MM_categorias ? `<span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:${t.MM_categorias.cor}"></span> ${t.MM_categorias.nome}` : t.MM_carteiras.nome;

                listEl.innerHTML += `
                    <div class="transaction-item">
                        <div class="t-info">
                            <span class="t-desc">${icon} ${t.descricao}</span>
                            <span class="t-cat">${catInfo} | ${dataFormatada}</span>
                        </div>
                        <div class="t-right">
                            <div class="t-amount ${amountClass}">${sign} R$ ${t.valor.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                            <div class="t-actions">
                                <button class="action-btn" onclick="editTransaction('${t.id}')">✏️</button>
                                <button class="action-btn" onclick="deleteTransaction('${t.id}')">❌</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // ====== FUNÇÕES DO MODAL (CRIAR, EDITAR, EXCLUIR) ======

        function openModal() {
            document.getElementById('modal-title').innerText = "Novo Lançamento";
            document.getElementById('trans-id').value = ""; 
            document.getElementById('modal').classList.add('active');
            document.getElementById('trans-date').valueAsDate = new Date();
            setTransType('despesa'); 
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('form-transaction').reset();
            document.getElementById('trans-id').value = "";
        }

        function editTransaction(id) {
            const t = currentMonthTransactions.find(x => x.id === id);
            if (!t) return;
            document.getElementById('modal-title').innerText = "Editar Lançamento";
            document.getElementById('trans-id').value = t.id; 
            document.getElementById('trans-value').value = t.valor;
            document.getElementById('trans-desc').value = t.descricao;
            document.getElementById('trans-date').value = t.data_transacao;
            document.getElementById('trans-origem').value = t.carteira_origem_id;

            setTransType(t.tipo); 
            
            if (t.tipo === 'despesa' || t.tipo === 'receita') {
                document.getElementById('trans-cat').value = t.categoria_id;
            } else if (t.tipo === 'transferencia') {
                document.getElementById('trans-destino').value = t.carteira_destino_id;
            }
            document.getElementById('modal').classList.add('active');
        }

        async function deleteTransaction(id) {
            if (confirm("Tem certeza que deseja excluir este lançamento? O saldo e a fatura serão recalculados automaticamente.")) {
                const { error } = await client.from('MM_transacoes').delete().eq('id', id);
                if (error) { alert("Erro ao excluir: " + error.message); } 
                else { loadTransactions(); }
            }
        }

        function setTransType(type) {
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.type-btn[data-type="${type}"]`).classList.add('active');
            document.getElementById('trans-type').value = type;

            const grpOrigem = document.getElementById('grp-origem');
            const lblOrigem = document.getElementById('lbl-origem');
            const grpDestino = document.getElementById('grp-destino');
            const grpCat = document.getElementById('grp-categoria');

            document.getElementById('trans-destino').required = false;
            document.getElementById('trans-cat').required = false;

            if (type === 'despesa' || type === 'receita') {
                grpDestino.classList.add('hidden-field');
                grpCat.classList.remove('hidden-field');
                lblOrigem.innerText = type === 'despesa' ? 'Meio de Pagamento (De onde sai)' : 'Conta de Recebimento (Onde entra)';
                document.getElementById('trans-cat').required = true;
            } 
            else if (type === 'transferencia') {
                grpDestino.classList.remove('hidden-field');
                grpCat.classList.add('hidden-field');
                lblOrigem.innerText = 'Conta de Origem (Sai de)';
                document.getElementById('trans-destino').required = true;
            }
            else if (type === 'rendimento') {
                grpDestino.classList.add('hidden-field');
                grpCat.classList.add('hidden-field');
                lblOrigem.innerText = 'Qual investimento rendeu?';
            }
        }

        async function saveTransaction(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.innerText = 'Salvando...';
            btn.disabled = true;

            const transId = document.getElementById('trans-id').value; 
            const tipo = document.getElementById('trans-type').value;
            const dt = document.getElementById('trans-date').value;
            const competencia = dt.substring(0, 7); 
            const valorTratado = parseFloat(document.getElementById('trans-value').value.toString().replace(',','.'));

            const payload = {
                familia_id: currentFamilyId,
                lancado_por: currentUser.id,
                tipo: tipo,
                valor: valorTratado,
                descricao: document.getElementById('trans-desc').value,
                data_transacao: dt,
                competencia: competencia,
                carteira_origem_id: document.getElementById('trans-origem').value
            };

            if (tipo === 'despesa' || tipo === 'receita') {
                payload.categoria_id = document.getElementById('trans-cat').value;
                payload.carteira_destino_id = null;
            } else if (tipo === 'transferencia') {
                payload.carteira_destino_id = document.getElementById('trans-destino').value;
                payload.categoria_id = null;
            } else if (tipo === 'rendimento') {
                payload.carteira_destino_id = null;
                payload.categoria_id = null;
            }

            let error;
            if (transId) {
                const res = await client.from('MM_transacoes').update(payload).eq('id', transId);
                error = res.error;
            } else {
                const res = await client.from('MM_transacoes').insert([payload]);
                error = res.error;
            }

            btn.innerText = 'Salvar';
            btn.disabled = false;

            if (error) { alert("Erro ao salvar: " + error.message); } 
            else { closeModal(); loadTransactions(); }
        }

        init();
    </script>
</body>
</html>
