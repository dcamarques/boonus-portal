<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Tags Críticas para PWA no iOS (Web App Nativo) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>My Money | Iniciar Sessão</title>
    
    <!-- Ícones e Partilha (Meta Tags) -->
    <link rel="icon" type="image/png" href="https://boonus.app.br/mymoney/icone.png">
    <link rel="apple-touch-icon" href="https://boonus.app.br/mymoney/icone.png">
    <meta name="theme-color" content="#0f172a">
    <meta property="og:title" content="My Money | Boonus">
    <meta property="og:description" content="Gestão de orçamento inteligente e compartilhado para a sua família.">
    <meta property="og:image" content="https://boonus.app.br/mymoney/banner.png">
    <meta property="og:url" content="https://boonus.app.br/mymoney/">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0f172a; --surface-color: #1e293b; --border-color: #334155;
            --text-primary: #f8fafc; --text-secondary: #94a3b8;
            --primary: #2563eb; --primary-hover: #1d4ed8;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; }
        
        /* O cálculo max() garante que a tela respeite o Safe Area do iPhone, mas mantenha 1rem de borda em navegadores normais */
        body { 
            background-color: var(--bg-color); color: var(--text-primary); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100dvh; 
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); 
        }
        
        .auth-container { background: var(--surface-color); padding: 2.5rem 2rem; border-radius: var(--radius); border: 1px solid var(--border-color); width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .auth-container h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; }
        .auth-container p { text-align: center; color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.9rem; }
        
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-secondary); }
        
        /* font-size: 16px bloqueia o zoom nativo do iOS / -webkit-appearance remove estilos padrão da Apple */
        .form-group input { width: 100%; padding: 0.85rem; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-size: 16px; outline: none; -webkit-appearance: none; }
        .form-group input:focus { border-color: var(--primary); }
        
        .btn-primary { width: 100%; padding: 1rem; border: none; border-radius: 8px; background: var(--primary); color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 0.5rem; }
        .btn-primary:hover { background: var(--primary-hover); }
        
        .auth-links { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 10px; text-align: center; }
        .auth-links a { color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 500; cursor: pointer; }
        .auth-links a:hover { text-decoration: underline; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1>💰 My Money</h1>
        <p id="subtitle">Acesse seu orçamento compartilhado</p>

        <!-- Formulário de INÍCIO DE SESSÃO -->
        <form id="form-login" onsubmit="handleLogin(event)">
            <div class="form-group"><label>E-mail</label><input type="email" id="login-email" required></div>
            <div class="form-group"><label>Senha</label><input type="password" id="login-password" required></div>
            <button type="submit" class="btn-primary" id="btn-login">Entrar</button>
            <div class="auth-links">
                <a onclick="showForm('register')">Não tem conta? Criar agora</a>
                <a onclick="showForm('forgot')" style="color: var(--text-secondary);">Esqueci minha senha</a>
            </div>
        </form>

        <!-- Formulário de CRIAÇÃO DE CONTA -->
        <form id="form-register" class="hidden" onsubmit="handleRegister(event)">
            <div class="form-group"><label>Seu E-mail</label><input type="email" id="reg-email" required></div>
            <div class="form-group"><label>Crie uma Senha</label><input type="password" id="reg-password" required minlength="6"></div>
            <button type="submit" class="btn-primary" id="btn-reg">Criar Conta</button>
            <div class="auth-links"><a onclick="showForm('login')">Já tenho conta. Voltar</a></div>
        </form>

        <!-- Formulário de ESQUECI MINHA SENHA -->
        <form id="form-forgot" class="hidden" onsubmit="handleForgot(event)">
            <p style="text-align: left; margin-bottom: 1rem;">Digite seu e-mail para receber um link de recuperação seguro.</p>
            <div class="form-group"><label>E-mail cadastrado</label><input type="email" id="forgot-email" required></div>
            <button type="submit" class="btn-primary" id="btn-forgot">Enviar link de recuperação</button>
            <div class="auth-links"><a onclick="showForm('login')">Voltar ao Início</a></div>
        </form>

        <!-- Formulário de ATUALIZAR SENHA (Abre via Link do Email) -->
        <form id="form-update" class="hidden" onsubmit="handleUpdatePassword(event)">
            <p style="text-align: left; margin-bottom: 1rem; color: var(--success);">Autenticação verificada. Defina a nova credencial.</p>
            <div class="form-group"><label>Nova Senha</label><input type="password" id="update-password" required minlength="6"></div>
            <button type="submit" class="btn-primary" id="btn-update">Salvar e Entrar</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://kafmnasrqcmbzvzaggap.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_k4w2E4ur7xJR6qd575inBA_sJoXqHoN';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Verifica se o usuário já tem sessão ativa
        async function checkSession() {
            const { data: { session } } = await client.auth.getSession();
            if (session) { window.location.replace('dashboard.html'); }
        }

        // Intercepta o evento de clicar no link do e-mail de recuperação
        client.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                showForm('update');
            }
        });

        function showForm(formType) {
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('form-register').classList.add('hidden');
            document.getElementById('form-forgot').classList.add('hidden');
            document.getElementById('form-update').classList.add('hidden');
            
            if(formType === 'login') { document.getElementById('form-login').classList.remove('hidden'); document.getElementById('subtitle').innerText = "Acesse seu orçamento compartilhado"; }
            if(formType === 'register') { document.getElementById('form-register').classList.remove('hidden'); document.getElementById('subtitle').innerText = "Bem-vindo ao My Money"; }
            if(formType === 'forgot') { document.getElementById('form-forgot').classList.remove('hidden'); document.getElementById('subtitle').innerText = "Recuperação de Acesso"; }
            if(formType === 'update') { document.getElementById('form-update').classList.remove('hidden'); document.getElementById('subtitle').innerText = "Redefinir Senha"; }
        }

        async function handleLogin(e) {
            e.preventDefault(); const btn = document.getElementById('btn-login'); btn.innerText = "Entrando..."; btn.disabled = true;
            const { error } = await client.auth.signInWithPassword({
                email: document.getElementById('login-email').value.trim(),
                password: document.getElementById('login-password').value
            });
            if (error) { alert("Erro ao entrar: Verifique suas credenciais."); btn.innerText = "Entrar"; btn.disabled = false; } 
            else { window.location.replace('dashboard.html'); }
        }

        async function handleRegister(e) {
            e.preventDefault(); const btn = document.getElementById('btn-reg'); btn.innerText = "Criando conta..."; btn.disabled = true;
            const { error } = await client.auth.signUp({
                email: document.getElementById('reg-email').value.trim(),
                password: document.getElementById('reg-password').value
            });
            if (error) { alert("Erro ao criar conta: " + error.message); btn.innerText = "Criar Conta"; btn.disabled = false; } 
            else { window.location.replace('dashboard.html'); } // Entra direto graças ao Trigger SQL
        }

        async function handleForgot(e) {
            e.preventDefault(); const btn = document.getElementById('btn-forgot'); btn.innerText = "Enviando..."; btn.disabled = true;
            const email = document.getElementById('forgot-email').value.trim();
            const { error } = await client.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + window.location.pathname
            });
            if (error) { alert("Erro: " + error.message); } 
            else { alert("✅ Se o e-mail existir em nossa base, você receberá um link de recuperação em instantes."); showForm('login'); }
            btn.innerText = "Enviar link de recuperação"; btn.disabled = false;
        }

        async function handleUpdatePassword(e) {
            e.preventDefault(); const btn = document.getElementById('btn-update'); btn.innerText = "Salvando..."; btn.disabled = true;
            const newPassword = document.getElementById('update-password').value;
            const { error } = await client.auth.updateUser({ password: newPassword });
            if (error) { alert("Erro ao atualizar: " + error.message); btn.innerText = "Salvar e Entrar"; btn.disabled = false; } 
            else { alert("Senha atualizada com sucesso!"); window.location.replace('dashboard.html'); }
        }

        checkSession();
    </script>
</body>
</html>
