<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boonus | Comparador de Renda Fixa</title>
    
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --input-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2.5rem 1.5rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .nav-back {
            display: inline-flex;
            align-items: center;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            transition: color 0.2s ease;
        }

        .nav-back:hover {
            color: var(--text-primary);
        }

        header {
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2.5rem;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 3rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        @media (max-width: 768px) {
            .card { 
                grid-template-columns: 1fr; 
                padding: 1.5rem;
                gap: 2rem;
            }
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Input Customizado com prefixo/sufixo */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
        }

        .input-prefix, .input-suffix {
            color: var(--text-secondary);
            font-size: 0.95rem;
            padding: 0 1rem;
            background-color: rgba(255,255,255,0.02);
            user-select: none;
        }

        .input-prefix { border-right: 1px solid var(--card-border); }
        .input-suffix { border-left: 1px solid var(--card-border); }

        input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 1.05rem;
            font-weight: 500;
        }

        input:focus { outline: none; }
        input[readonly] { color: var(--success); font-weight: 600; }

        .btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            border: none;
            background-color: var(--accent);
            color: #ffffff;
            margin-top: 2rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        /* Painel de Resultados */
        .results-panel {
            background: linear-gradient(145deg, rgba(15,23,42,0.6) 0%, rgba(15,23,42,0.9) 100%);
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .result-item {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .result-item:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .result-label {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .result-subtext {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .winner-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            text-align: center;
        }

        .winner-title {
            color: var(--success);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .winner-diff {
            color: var(--text-primary);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="nav-back">&larr; Voltar ao Menu de Multi-Ativos</a>

        <header>
            <h1>Comparador de Renda Fixa</h1>
            <p class="subtitle">Simulação de equivalência: CDB (Tributável) vs LCI/LCA (Isento) atrelados ao CDI.</p>
        </header>

        <main class="card">
            <!-- Coluna 1: Entradas -->
            <div class="inputs-panel">
                
                <div class="form-group">
                    <label for="taxaCdi">CDI Atual (Automático via BCB)</label>
                    <div class="input-wrapper">
                        <input type="text" id="taxaCdi" readonly>
                        <span class="input-suffix">%</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="aporte">Aporte Inicial</label>
                    <div class="input-wrapper">
                        <span class="input-prefix">R$</span>
                        <input type="text" id="aporte" placeholder="0,00" oninput="mascaraMoeda(event)">
                    </div>
                </div>

                <div class="form-group">
                    <label for="prazo">Prazo da Operação</label>
                    <div class="input-wrapper">
                        <input type="text" id="prazo" placeholder="0" oninput="mascaraInteiro(event)">
                        <span class="input-suffix">meses</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="taxaCdb">Rentabilidade CDB</label>
                    <div class="input-wrapper">
                        <input type="text" id="taxaCdb" placeholder="110,00" oninput="mascaraPercentual(event)">
                        <span class="input-suffix">% do CDI</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="taxaLci">Rentabilidade LCI/LCA</label>
                    <div class="input-wrapper">
                        <input type="text" id="taxaLci" placeholder="90,00" oninput="mascaraPercentual(event)">
                        <span class="input-suffix">% do CDI</span>
                    </div>
                </div>
                
                <button class="btn" onclick="compararRentabilidade()">Executar Projeção</button>
            </div>

            <!-- Coluna 2: Resultados -->
            <div class="results-panel" id="painel-resultado">
                <div style="text-align: center; color: var(--text-secondary);">
                    <svg style="width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.5;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    <p>Preencha os parâmetros e clique em executar para visualizar a análise líquida do portfólio.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ==========================================
        // MÁSCARAS DE INPUT (Padrão PT-BR)
        // ==========================================
        function mascaraMoeda(e) {
            let valor = e.target.value.replace(/\D/g, "");
            if (valor === "") { e.target.value = ""; return; }
            valor = (parseInt(valor) / 100).toFixed(2);
            valor = valor.replace(".", ",");
            valor = valor.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
            e.target.value = valor;
        }

        function mascaraPercentual(e) {
            let valor = e.target.value.replace(/\D/g, "");
            if (valor === "") { e.target.value = ""; return; }
            valor = (parseInt(valor) / 100).toFixed(2);
            valor = valor.replace(".", ",");
            e.target.value = valor;
        }

        function mascaraInteiro(e) {
            e.target.value = e.target.value.replace(/\D/g, "");
        }

        // Converte string PT-BR (ex: 1.000,50) para Float JS (1000.50)
        function desformatar(valorString) {
            if (!valorString) return 0;
            return parseFloat(valorString.replace(/\./g, "").replace(",", "."));
        }

        // ==========================================
        // FETCH API BCB & LÓGICA DE NEGÓCIO
        // ==========================================
        async function buscarTaxaCDI() {
            try {
                const url = 'https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json';
                const resposta = await fetch(url);
                const dados = await resposta.json();
                
                const selicAtual = parseFloat(dados[0].valor);
                const cdiAtual = selicAtual - 0.10; 
                
                // Formata o CDI capturado para o padrão visual (ex: 10,40)
                document.getElementById('taxaCdi').value = cdiAtual.toFixed(2).replace('.', ',');
            } catch (erro) {
                console.error("Erro ao buscar a taxa no BCB:", erro);
                document.getElementById('taxaCdi').value = "10,40"; // Fallback seguro
            }
        }

        function obterAliquotaIR(meses) {
            if (meses <= 6) return 0.225;
            if (meses <= 12) return 0.20;
            if (meses <= 24) return 0.175;
            return 0.15;
        }

        // Formatação final para exibição nos resultados
        const formatarBRL = (valor) => valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        const formatarPerc = (valor) => (valor * 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';

        function compararRentabilidade() {
            // Captura e desformata os valores digitados
            const cdiAtualAno = desformatar(document.getElementById('taxaCdi').value);
            const aporte = desformatar(document.getElementById('aporte').value);
            const meses = parseInt(document.getElementById('prazo').value);
            const percCdb = desformatar(document.getElementById('taxaCdb').value);
            const percLci = desformatar(document.getElementById('taxaLci').value);

            if (!aporte || !meses || !percCdb || !percLci || !cdiAtualAno) {
                alert("Por favor, preencha todos os campos numéricos para realizar a projeção.");
                return;
            }

            // Cálculo das taxas anuais efetivas
            const taxaCdbAno = (cdiAtualAno * (percCdb / 100)) / 100;
            const taxaLciAno = (cdiAtualAno * (percLci / 100)) / 100;

            // Equivalência (Anual para Mensal)
            const taxaCdbMes = Math.pow(1 + taxaCdbAno, 1/12) - 1;
            const taxaLciMes = Math.pow(1 + taxaLciAno, 1/12) - 1;

            // Projeção Bruta
            const montanteBrutoCdb = aporte * Math.pow(1 + taxaCdbMes, meses);
            const montanteBrutoLci = aporte * Math.pow(1 + taxaLciMes, meses);

            // Desconto de IR
            const lucroCdb = montanteBrutoCdb - aporte;
            const ir = lucroCdb * obterAliquotaIR(meses);
            const montanteLiquidoCdb = montanteBrutoCdb - ir;
            const rentabilidadeLiquidaCdb = (montanteLiquidoCdb / aporte) - 1;
            const rentabilidadeLiquidaLci = (montanteBrutoLci / aporte) - 1;

            // Análise de Vencedor
            let vencedorTitulo = "Empate Técnico";
            let diferencaFinanceira = 0;
            
            if (montanteLiquidoCdb > montanteBrutoLci) {
                vencedorTitulo = "🏆 CDB é a melhor opção";
                diferencaFinanceira = montanteLiquidoCdb - montanteBrutoLci;
            } else if (montanteBrutoLci > montanteLiquidoCdb) {
                vencedorTitulo = "🏆 LCI/LCA é a melhor opção";
                diferencaFinanceira = montanteBrutoLci - montanteLiquidoCdb;
            }

            // Injeção do HTML de Resultado
            document.getElementById('painel-resultado').innerHTML = `
                <div class="result-item">
                    <div class="result-label">CDB (Líquido após IR)</div>
                    <div class="result-value">${formatarBRL(montanteLiquidoCdb)}</div>
                    <div class="result-subtext">
                        <span>Taxa Efetiva Anual: <strong style="color: var(--text-primary)">${formatarPerc(taxaCdbAno)}</strong></span>
                        <span>Rentab. Período: <strong style="color: var(--text-primary)">${formatarPerc(rentabilidadeLiquidaCdb)}</strong></span>
                    </div>
                </div>

                <div class="result-item">
                    <div class="result-label">LCI/LCA (Isento)</div>
                    <div class="result-value">${formatarBRL(montanteBrutoLci)}</div>
                    <div class="result-subtext">
                        <span>Taxa Efetiva Anual: <strong style="color: var(--text-primary)">${formatarPerc(taxaLciAno)}</strong></span>
                        <span>Rentab. Período: <strong style="color: var(--text-primary)">${formatarPerc(rentabilidadeLiquidaLci)}</strong></span>
                    </div>
                </div>

                <div class="winner-box">
                    <div class="winner-title">${vencedorTitulo}</div>
                    <div class="winner-diff">
                        Geração de <strong>${formatarBRL(diferencaFinanceira)}</strong> a mais no vencimento.
                    </div>
                </div>
            `;
        }

        // Executar fetch ao carregar a tela
        document.addEventListener('DOMContentLoaded', buscarTaxaCDI);
    </script>
</body>
</html>
