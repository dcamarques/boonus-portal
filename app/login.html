<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Interno - Boonus</title>
    
    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Alertas elegantes via SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --neon-color: #00ff88;
            --dark-bg: #050505;
            --panel-bg: #111;
            --text-color: #e0e0e0;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .login-container {
            background-color: var(--panel-bg);
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-top: 4px solid var(--neon-color);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--neon-color);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #aaa;
            text-transform: uppercase;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--neon-color);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--neon-color);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #00cc6a;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .forgot-password {
            display: block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
            cursor: pointer;
        }

        .forgot-password:hover {
            color: var(--neon-color);
        }

        /* Overlay de bloqueio */
        #block-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 17, 17, 0.95);
            border-radius: 12px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .loader {
            border: 4px solid #333;
            border-top: 4px solid var(--neon-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 0 auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Tela de Bloqueio por Tentativas -->
        <div id="block-overlay">
            <h2 style="color: var(--negative-color);">ACESSO BLOQUEADO</h2>
            <p style="color: #ccc; font-size: 0.9rem; margin: 10px 30px;">Foram detetadas 3 tentativas falhadas. Aguarde antes de tentar novamente.</p>
        </div>

        <div class="logo">BOONUS<span>.TV</span></div>
        <div class="subtitle">Gestão de Performance Interativa</div>

        <form id="login-form">
            <div class="input-group">
                <label for="email">E-mail Corporativo</label>
                <input type="email" id="email" required placeholder="exemplo@escritorio.com.br" autocomplete="username">
            </div>

            <div class="input-group">
                <label for="password">Palavra-passe</label>
                <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login" id="btn-submit">
                <span id="btn-text">Aceder ao Painel</span>
                <div class="loader" id="btn-loader"></div>
            </button>
            
            <a class="forgot-password" onclick="recuperarSenha()">Esqueceu a sua palavra-passe?</a>
        </form>
    </div>

    <script>
        console.log("Inicializando o sistema de Login V1.3...");

        // ==========================================
        // CONFIGURAÇÃO SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://vlnzhrhzzhbzdvhmsuap.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_fmqGGaxEPBatRTMzL5sTnw_FWrgvqr6'; 
        
        // CORREÇÃO: Usar um nome de variável diferente para evitar colisão com o objeto global 'supabase' da CDN
        let supabaseClient; 

        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            console.log("Conexão com Supabase configurada.");
        } catch (e) {
            console.error("ERRO CRÍTICO: Falha ao carregar a biblioteca do Supabase.", e);
        }

        // ==========================================
        // LÓGICA DE SEGURANÇA E BLOQUEIO
        // ==========================================
        let failedAttempts = parseInt(localStorage.getItem('boonus_login_attempts')) || 0;
        let lockTime = parseInt(localStorage.getItem('boonus_lock_time')) || 0;

        console.log(`Estado atual - Tentativas falhadas: ${failedAttempts}`);

        function verificarBloqueio() {
            const now = new Date().getTime();
            if (lockTime > now) {
                console.log("O sistema está atualmente BLOQUEADO.");
                document.getElementById('block-overlay').style.display = 'flex';
                const relogio = setInterval(() => {
                    if (new Date().getTime() > lockTime) {
                        clearInterval(relogio);
                        localStorage.removeItem('boonus_lock_time');
                        localStorage.removeItem('boonus_login_attempts');
                        failedAttempts = 0;
                        document.getElementById('block-overlay').style.display = 'none';
                        console.log("Bloqueio removido pelo tempo expirado.");
                    }
                }, 1000);
                return true;
            }
            return false;
        }

        verificarBloqueio();

        function toggleLoading(isLoading) {
            document.getElementById('btn-text').style.display = isLoading ? 'none' : 'block';
            document.getElementById('btn-loader').style.display = isLoading ? 'block' : 'none';
            document.getElementById('btn-submit').disabled = isLoading;
        }

        // ==========================================
        // PROCESSO DE LOGIN
        // ==========================================
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log("Formulário submetido. Iniciando validação...");

            if (verificarBloqueio()) return;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            toggleLoading(true);

            try {
                console.log("A enviar pedido de autenticação para o Supabase...");
                
                // Usando a nova variável 'supabaseClient'
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    throw error;
                }

                console.log("Login com Sucesso!", data);
                localStorage.removeItem('boonus_login_attempts');
                localStorage.removeItem('boonus_lock_time');
                
                Swal.fire({
                    icon: 'success',
                    title: 'Autenticado!',
                    text: 'A redirecionar para o painel de controlo...',
                    background: '#111', color: '#fff', confirmButtonColor: '#00ff88',
                    timer: 1500, showConfirmButton: false
                }).then(() => {
                    console.log("Redirecionamento será implementado aqui.");
                });

            } catch (err) {
                console.error("Erro capturado durante o login:", err.message);
                
                failedAttempts++;
                localStorage.setItem('boonus_login_attempts', failedAttempts);
                console.log(`Nova contagem de tentativas: ${failedAttempts}`);

                if (failedAttempts >= 3) {
                    console.warn("Limite de tentativas atingido. Bloqueando acesso.");
                    const blockDuration = 5 * 60 * 1000; // 5 minutos de bloqueio
                    localStorage.setItem('boonus_lock_time', new Date().getTime() + blockDuration);
                    verificarBloqueio();
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Acesso Negado',
                        text: `Credenciais inválidas. Tem mais ${3 - failedAttempts} tentativa(s).`,
                        background: '#111', color: '#fff', confirmButtonColor: '#ff4444'
                    });
                }
            } finally {
                toggleLoading(false);
            }
        });

        // ==========================================
        // RECUPERAÇÃO DE PALAVRA-PASSE
        // ==========================================
        async function recuperarSenha() {
            console.log("Acionado pedido de recuperação de palavra-passe.");
            
            const emailValue = document.getElementById('email').value.trim();
            
            const { value: emailToRecover } = await Swal.fire({
                title: 'Recuperar Palavra-passe',
                input: 'email',
                inputLabel: 'Insira o seu e-mail corporativo',
                inputValue: emailValue,
                background: '#111', color: '#fff', 
                confirmButtonColor: '#00ff88', cancelButtonColor: '#333',
                showCancelButton: true,
                confirmButtonText: 'Enviar Link'
            });

            if (emailToRecover) {
                Swal.fire({ title: 'A enviar...', allowOutsideClick: false, background: '#111', color: '#fff', didOpen: () => { Swal.showLoading(); }});
                
                // Usando a nova variável 'supabaseClient'
                const { error } = await supabaseClient.auth.resetPasswordForEmail(emailToRecover, {
                    redirectTo: window.location.origin + '/app/redefinir-senha.html', 
                });

                if (error) {
                    Swal.fire('Erro!', 'Ocorreu um problema ao enviar o e-mail.', 'error');
                } else {
                    Swal.fire('Enviado!', 'Verifique a sua caixa de entrada.', 'success');
                }
            }
        }
    </script>
</body>
</html>
