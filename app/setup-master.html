<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Criar Conta - Boonus</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --neon-color: #00ff88;
            --dark-bg: #050505;
            --panel-bg: #111;
            --card-bg: #1a1a1a;
            --text-color: #e0e0e0;
            --muted: #888;
            --border: #333;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px 24px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
        }
        .brand { text-align: center; margin-bottom: 22px; }
        .brand-title { font-size: 1.5rem; font-weight: 800; color: #fff; margin: 0; letter-spacing: 0.5px; }
        .brand-title span { color: var(--neon-color); }
        .brand-sub { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }

        .input-group { margin-bottom: 15px; }
        .input-group label {
            display: block; font-size: 0.75rem; color: var(--muted);
            margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .input-group input {
            width: 100%; padding: 12px 14px; border-radius: 8px;
            border: 1px solid var(--border); background: #0a0a0a; color: #fff; font-size: 0.95rem;
        }
        .input-group input:focus { outline: none; border-color: var(--neon-color); }

        .password-wrap { position: relative; }
        .toggle-pass {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.85rem;
        }

        .btn-primary {
            width: 100%; padding: 14px; background: var(--neon-color); color: #000;
            border: none; border-radius: 8px; font-weight: bold; font-size: 0.95rem;
            text-transform: uppercase; cursor: pointer; margin-top: 6px;
        }
        .btn-primary:hover { opacity: 0.9; }

        .footer-link { text-align: center; margin-top: 18px; font-size: 0.85rem; color: var(--muted); }
        .footer-link a { color: var(--neon-color); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand">
            <h1 class="brand-title">Boonus <span>App</span></h1>
            <p class="brand-sub">Crie sua conta para começar</p>
        </div>

        <form id="form-cadastro" onsubmit="registrarUsuario(event)">
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required placeholder="Ex: Cyntia Marques">
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>

            <div class="input-group">
                <label for="senha">Crie uma Senha</label>
                <div class="password-wrap">
                    <input type="password" id="senha" required minlength="6" placeholder="Mínimo de 6 caracteres">
                    <button type="button" class="toggle-pass" onclick="alternarSenha()">Mostrar</button>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="btn-submit">Criar Conta</button>
        </form>

        <div class="footer-link">
            Já possui conta? <a href="login.html">Fazer login</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vlnzhrhzzhbzdvhmsuap.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_fmqGGaxEPBatRTMzL5sTnw_FWrgvqr6';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function alternarSenha() {
            const input = document.getElementById('senha');
            const btn = document.querySelector('.toggle-pass');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Ocultar';
            } else {
                input.type = 'password';
                btn.textContent = 'Mostrar';
            }
        }

        async function registrarUsuario(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-submit');
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const senha = document.getElementById('senha').value;

            btn.disabled = true;
            btn.textContent = 'Criando conta...';

            try {
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email,
                    password: senha,
                    options: { data: { nome } }
                });

                if (authError) throw authError;

                const userId = authData.user?.id;
                if (userId) {
                    const { error: perfilError } = await supabaseClient
                        .from('ES_usuarios_perfis')
                        .upsert([{
                            auth_id: userId,
                            nome,
                            email,
                            cargo: 'Sócio Diretor',
                            nivel_acesso: 1,
                            escritorio_id: null,
                            ativo: true
                        }], { onConflict: 'auth_id' });

                    if (perfilError) {
                        console.warn('Aviso ao criar perfil inicial:', perfilError.message);
                    }
                }

                await Swal.fire({
                    icon: 'success',
                    title: 'Conta criada!',
                    text: 'Agora você será direcionado para o painel, onde verificaremos convites ou o cadastro do seu escritório.',
                    background: '#111', color: '#fff', confirmButtonColor: '#00ff88'
                });

                window.location.href = 'dashboard.html';
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Não foi possível criar a conta',
                    text: err.message || 'Tente novamente.',
                    background: '#111', color: '#fff', confirmButtonColor: '#ff4444'
                });
                btn.disabled = false;
                btn.textContent = 'Criar Conta';
            }
        }
    </script>
</body>
</html>
