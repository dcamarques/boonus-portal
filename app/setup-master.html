<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta Master - Boonus</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --neon-color: #00ff88; --dark-bg: #050505; --panel-bg: #111; --text-color: #e0e0e0; }
        body { background-color: var(--dark-bg); color: var(--text-color); font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .setup-container { background-color: var(--panel-bg); padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border-top: 4px solid var(--neon-color); width: 100%; max-width: 450px; }
        .logo { font-size: 2rem; font-weight: bold; color: #fff; margin-bottom: 5px; text-align: center; letter-spacing: 2px; }
        .logo span { color: var(--neon-color); }
        .subtitle { font-size: 0.9rem; color: #888; text-transform: uppercase; text-align: center; margin-bottom: 30px; letter-spacing: 1px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: #aaa; text-transform: uppercase; font-weight: 600; }
        .input-group input { width: 100%; padding: 12px 15px; background-color: #1a1a1a; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 1rem; box-sizing: border-box; }
        .input-group input:focus { outline: none; border-color: var(--neon-color); }
        .btn-submit { width: 100%; padding: 14px; background-color: var(--neon-color); color: #000; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .login-link { display: block; text-align: center; margin-top: 20px; color: #888; text-decoration: none; font-size: 0.85rem; }
        .login-link:hover { color: var(--neon-color); }
        #success-box { display: none; text-align: center; padding: 20px 0; }
        #success-box h3 { color: var(--neon-color); font-size: 1.5rem; margin-bottom: 10px; }
        #success-box p { color: #aaa; font-size: 0.95rem; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="logo">BOONUS<span>.TV</span></div>
        <div class="subtitle">Passo 1/2: Criar Conta Master</div>

        <form id="setup-form">
            <div class="input-group">
                <label>Seu Nome Completo</label>
                <input type="text" id="nome_responsavel" required placeholder="Ex: Carlos Silva">
            </div>
            <div class="input-group">
                <label>E-mail Corporativo</label>
                <input type="email" id="email" required placeholder="diretoria@escritorio.com.br">
            </div>
            <div class="input-group">
                <label>Senha de Acesso</label>
                <input type="password" id="password" required placeholder="Mínimo de 6 caracteres" minlength="6">
            </div>
            <button type="submit" class="btn-submit" id="btn-submit">Criar Conta</button>
            <a href="login.html" class="login-link">Já tem uma conta? Faça login aqui.</a>
        </form>

        <div id="success-box">
            <h3>Quase lá! 📩</h3>
            <p>Enviamos um link de confirmação para <br><b id="mail-sent" style="color:#fff;"></b>.</p>
            <p>Por favor, clique no link enviado para o seu e-mail para ativar a conta e configurar o seu escritório.</p>
            <a href="login.html" class="btn-submit" style="display:inline-block; text-decoration:none; margin-top:20px; width:80%;">Ir para o Login</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vlnzhrhzzhbzdvhmsuap.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_fmqGGaxEPBatRTMzL5sTnw_FWrgvqr6'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('setup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome_responsavel').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-submit');
            
            btn.disabled = true; btn.innerText = 'Aguarde...';

            try {
                // Passamos o nome nos metadados para usá-lo na Etapa 2
                const { data, error } = await supabaseClient.auth.signUp({
                    email, password, options: { data: { nome_completo: nome } }
                });

                if (error) throw error;

                if (data.session) {
                    // Se o Supabase não exigir confirmação de e-mail, já está logado
                    window.location.href = 'setup-escritorio.html';
                } else {
                    // Exige confirmação de e-mail
                    document.getElementById('setup-form').style.display = 'none';
                    document.getElementById('mail-sent').innerText = email;
                    document.getElementById('success-box').style.display = 'block';
                }
            } catch (err) {
                let msg = err.message;
                if (msg.includes('already registered')) msg = 'Este e-mail já está cadastrado.';
                Swal.fire({ icon: 'error', title: 'Erro', text: msg, background: '#111', color: '#fff', confirmButtonColor: '#ff4444' });
                btn.disabled = false; btn.innerText = 'Criar Conta';
            }
        });
    </script>
</body>
</html>
