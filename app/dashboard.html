<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boonus - App do Consultor</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --neon-color: #00ff88; --dark-bg: #050505; --panel-bg: #111; --card-bg: #1a1a1a; --text-color: #e0e0e0; --muted: #888; --border: #333; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--dark-bg); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; display: none; height: 100vh; overflow: hidden; flex-direction: column; }
        
        /* HEADER */
        .app-header { padding: 15px 20px; background: var(--panel-bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .user-greeting { font-size: 1.1rem; font-weight: bold; color: #fff; margin: 0; }
        .user-role { font-size: 0.7rem; color: var(--neon-color); text-transform: uppercase; }
        
        /* FILTROS (Tempo e Hierarquia) */
        .filters-bar { background: #0a0a0a; padding: 10px 20px; display: flex; gap: 10px; border-bottom: 1px solid var(--border); overflow-x: auto; white-space: nowrap; }
        .filter-input { background: #222; border: 1px solid var(--border); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; outline: none; flex: 1; }
        .filter-input:focus { border-color: var(--neon-color); }
        
        /* ÁREA PRINCIPAL E CARTÕES */
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 90px; }
        
        .prod-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .prod-classe { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .prod-item { font-size: 1.3rem; font-weight: bold; color: #fff; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .prod-subitem-badge { font-size: 0.7rem; background: #333; padding: 3px 8px; border-radius: 12px; color: var(--neon-color); border: 1px solid var(--neon-color); }
        
        .prod-stats { display: flex; justify-content: space-between; margin-bottom: 15px; gap: 10px; }
        .stat-box { flex: 1; background: #111; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #222; }
        .stat-box.highlight { border-color: var(--neon-color); background: rgba(0, 255, 136, 0.05); }
        .stat-label { display: block; font-size: 0.65rem; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
        .stat-val { display: block; font-size: 1rem; font-weight: bold; color: #fff; }
        
        .progress-container { background: #222; border-radius: 10px; height: 8px; width: 100%; overflow: hidden; margin-bottom: 8px; }
        .progress-bar { background: var(--neon-color); height: 100%; width: 0%; transition: width 1s ease-in-out; }
        .progress-text { font-size: 0.75rem; color: var(--muted); text-align: right; }

        /* NOVA SESSÃO: PIPELINE */
        .pipe-section { margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--border); }

        /* MENU INFERIOR E MODAL */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--panel-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 25px 0; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--muted); text-decoration: none; font-size: 0.75rem; gap: 5px; cursor: pointer; transition: color 0.3s; }
        .nav-item.active { color: var(--neon-color); }
        .nav-icon { font-size: 1.5rem; }
        .nav-fab { background: var(--neon-color); color: #000; width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; margin-top: -30px; box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4); }
        
        .bottom-sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; display: none; opacity: 0; transition: opacity 0.3s; }
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; background: var(--panel-bg); border-radius: 20px 20px 0 0; z-index: 1000; padding: 20px; transition: bottom 0.4s; max-height: 90vh; overflow-y: auto; border-top: 2px solid var(--neon-color); }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sheet-title { margin: 0; font-size: 1.2rem; color: #fff; }
        .btn-close { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; }
        .input-group select, .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #1a1a1a; color: #fff; font-size: 1rem; appearance: none; }
        .input-group select:disabled { opacity: 0.5; }
        .btn-submit { width: 100%; padding: 15px; background: var(--neon-color); color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; margin-top: 10px; cursor: pointer; text-transform: uppercase; }
        
        #init-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid var(--neon-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="init-loader"><div class="spinner"></div><div style="color: #888; font-size: 0.85rem; letter-spacing: 1px;">CARREGANDO DADOS...</div></div>
    
    <header class="app-header">
        <div>
            <h1 class="user-greeting">Olá, <span id="user-name">...</span></h1>
            <div class="user-role" id="user-role">Consultor</div>
        </div>
        <a href="admin-catalogo.html" id="admin-icon" style="display: none; font-size: 1.5rem; text-decoration: none;" title="Configurar Catálogo">⚙️</a>
    </header>

    <div class="filters-bar">
        <input type="date" id="filtro-data" class="filter-input" onchange="carregarPainel()" title="Escolha uma data">
        <select id="filtro-hierarquia" class="filter-input" style="display: none;" onchange="carregarPainel()">
            <option value="meu_perfil">Minha Produção</option>
            <option value="grupo">Todo o Grupo (Visão Master)</option>
        </select>
    </div>

    <main class="main-content" id="cards-container">
        <!-- Injetado via JS -->
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active"><span class="nav-icon">📊</span><span>Resumo</span></div>
        <div class="nav-item"><span class="nav-icon">🎯</span><span>Metas</span></div>
        <div class="nav-item" onclick="abrirLancamento()"><div class="nav-fab">➕</div></div>
        <div class="nav-item"><span class="nav-icon">🏆</span><span>Ranking</span></div>
        <div class="nav-item" onclick="fazerLogoff()"><span class="nav-icon">🚪</span><span>Sair</span></div>
    </nav>

    <div class="bottom-sheet-overlay" id="sheet-overlay" onclick="fecharLancamento()"></div>
    <div class="bottom-sheet" id="sheet-lancamento">
        <div class="sheet-header"><h2 class="sheet-title">Novo Lançamento</h2><button class="btn-close" onclick="fecharLancamento()">×</button></div>
        <form id="form-producao">
            <div class="input-group"><label>Data</label><input type="date" id="form-data-lancamento" required></div>
            <div class="input-group"><label>Classe</label><select id="form-classe" required onchange="onClasseChange()"><option value="" disabled selected>A carregar...</option></select></div>
            <div class="input-group"><label>Item</label><select id="form-item" required disabled onchange="onItemChange()"><option value="" disabled selected>Aguardando Classe...</option></select></div>
            <div class="input-group" id="box-subitem" style="display: none;"><label>Subitem</label><select id="form-subitem"><option value="">Nenhum</option></select></div>
            <div class="input-group"><label>Status</label><select id="form-status" required disabled onchange="onStatusChange()"><option value="" disabled selected>Aguardando Classe...</option></select></div>
            <div class="input-group" id="box-pipeline" style="display: none;"><label>Temperatura do Pipeline</label><select id="form-pipeline"><option value="Quente">Quente</option><option value="Morno">Morno</option><option value="Frio">Frio</option></select></div>
            <div class="input-group"><label id="label-valor">Valor / Qtd</label><input type="number" id="form-valor" required placeholder="0.00" step="0.01"></div>
            <button type="submit" class="btn-submit">Registrar Produção</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://vlnzhrhzzhbzdvhmsuap.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_fmqGGaxEPBatRTMzL5sTnw_FWrgvqr6'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let sessaoAtual = { usuario_id: null, escritorio_id: null, grupo_id: null, nivel: 1 };
        let catalogoCache = []; 

        const formatadorBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 0, maximumFractionDigits: 0 });
        const formatadorQtd = new Intl.NumberFormat('pt-BR', { style: 'decimal' });

        async function validarSessao() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (error || !session) { window.location.href = 'login.html'; return; }
            
            sessaoAtual.usuario_id = session.user.id;
            const { data: userDb } = await supabaseClient.from('tv_utilizadores').select('nome_completo, perfil, nivel, escritorio_id, grupo_id').eq('id', session.user.id).single();
            
            if (userDb) {
                document.getElementById('user-name').innerText = (userDb.nome_completo || session.user.email).split(' ')[0];
                sessaoAtual.escritorio_id = userDb.escritorio_id; sessaoAtual.grupo_id = userDb.grupo_id; sessaoAtual.nivel = userDb.nivel || 1;
                
                if (userDb.nivel === 3) {
                    document.getElementById('user-role').innerText = 'Sócio Diretor (Master)';
                    document.getElementById('admin-icon').style.display = 'block';
                    document.getElementById('filtro-hierarquia').style.display = 'block'; 
                } else if (userDb.nivel === 2) {
                    document.getElementById('user-role').innerText = 'Gestor de Escritório';
                }
            }

            const hoje = new Date();
            const offset = hoje.getTimezoneOffset() * 60000;
            const dataLocal = (new Date(hoje - offset)).toISOString().slice(0, 10);
            
            document.getElementById('filtro-data').value = dataLocal;
            document.getElementById('form-data-lancamento').value = dataLocal;

            await carregarCatalogoDoBanco(); 
            await carregarPainel(); 
            
            document.body.style.display = 'flex'; 
            document.getElementById('init-loader').style.display = 'none';
        }

        async function carregarPainel() {
            document.getElementById('init-loader').style.display = 'flex';

            const dataFiltro = document.getElementById('filtro-data').value; 
            if (!dataFiltro) return;

            const ano = dataFiltro.substring(0, 4);
            const mes = dataFiltro.substring(5, 7);
            const ultimoDiaDoMes = new Date(ano, mes, 0).getDate();
            const visao = document.getElementById('filtro-hierarquia').value;

            let query = supabaseClient.from('tv_producao').select('*')
                .eq('ativo', true)
                .gte('data_producao', `${ano}-${mes}-01`)
                .lte('data_producao', `${ano}-${mes}-${ultimoDiaDoMes}`); 

            if (visao === 'meu_perfil') query = query.eq('utilizador_id', sessaoAtual.usuario_id);
            else if (visao === 'grupo' && sessaoAtual.nivel === 3) query = query.eq('grupo_id', sessaoAtual.grupo_id);

            const { data: producoes, error } = await query;
            if (error) alert("Erro ao ler dados: " + error.message);
            const producoesArray = producoes || [];

            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            if (catalogoCache.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#888;">Catálogo não configurado.</div>';
                document.getElementById('init-loader').style.display = 'none';
                return;
            }

            catalogoCache.forEach(classe => {
                if (!classe.tv_catalogo_itens) return;
                
                classe.tv_catalogo_itens.forEach(item => {
                    
                    // 1. DADOS DO ITEM PRINCIPAL (COM SEPARAÇÃO REAL x PIPELINE)
                    let realMesItem = 0; let realDiaItem = 0;
                    let pQuenteItem = 0; let pMornoItem = 0; let pFrioItem = 0;
                    
                    producoesArray.filter(p => p.classe_nome === classe.nome && p.item_nome === item.nome).forEach(p => {
                        const val = parseFloat(item.tipo_medida === 'valor' ? p.valor : p.quantidade) || 0;
                        
                        // SEPARAÇÃO: Verifica se o status é Pipeline
                        if (p.status.toLowerCase().includes('pipeline')) {
                            const pipeLevel = p.pipeline ? p.pipeline.toLowerCase() : '';
                            if (pipeLevel === 'quente') pQuenteItem += val;
                            else if (pipeLevel === 'morno') pMornoItem += val;
                            else pFrioItem += val; // Frio é o padrão se não vier preenchido
                        } else {
                            // Se não for Pipeline, entra no Realizado
                            realMesItem += val;
                            if (p.data_producao === dataFiltro) realDiaItem += val;
                        }
                    });

                    const totalPipeItem = pQuenteItem + pMornoItem + pFrioItem;

                    if (!item.tv_catalogo_subitens || item.tv_catalogo_subitens.length === 0 || realMesItem > 0 || totalPipeItem > 0) {
                        const metaItem = item.tipo_medida === 'valor' ? 100000 : 20; 
                        let percentItem = (realMesItem / metaItem) * 100;
                        const fmt = item.tipo_medida === 'valor' ? formatadorBRL : formatadorQtd;
                        const sufixo = item.tipo_medida === 'quantidade' ? ' un.' : '';

                        container.innerHTML += gerarHtmlCartao(classe.nome, item.nome, '', realDiaItem, realMesItem, metaItem, percentItem, pQuenteItem, pMornoItem, pFrioItem, fmt, sufixo);
                    }

                    // 2. DADOS DOS SUBITENS
                    if (item.tv_catalogo_subitens && item.tv_catalogo_subitens.length > 0) {
                        item.tv_catalogo_subitens.forEach(sub => {
                            let realMesSub = 0; let realDiaSub = 0;
                            let pQuenteSub = 0; let pMornoSub = 0; let pFrioSub = 0;

                            producoesArray.filter(p => p.classe_nome === classe.nome && p.item_nome === item.nome && p.subitem_nome === sub.nome).forEach(p => {
                                const val = parseFloat(item.tipo_medida === 'valor' ? p.valor : p.quantidade) || 0;
                                
                                if (p.status.toLowerCase().includes('pipeline')) {
                                    const pipeLevel = p.pipeline ? p.pipeline.toLowerCase() : '';
                                    if (pipeLevel === 'quente') pQuenteSub += val;
                                    else if (pipeLevel === 'morno') pMornoSub += val;
                                    else pFrioSub += val;
                                } else {
                                    realMesSub += val;
                                    if (p.data_producao === dataFiltro) realDiaSub += val;
                                }
                            });

                            const totalPipeSub = pQuenteSub + pMornoSub + pFrioSub;
                            const metaSub = item.tipo_medida === 'valor' ? 50000 : 10; 
                            let percentSub = (realMesSub / metaSub) * 100;
                            const fmt = item.tipo_medida === 'valor' ? formatadorBRL : formatadorQtd;
                            const sufixo = item.tipo_medida === 'quantidade' ? ' un.' : '';

                            container.innerHTML += gerarHtmlCartao(classe.nome, item.nome, sub.nome, realDiaSub, realMesSub, metaSub, percentSub, pQuenteSub, pMornoSub, pFrioSub, fmt, sufixo);
                        });
                    }
                });
            });

            // Anima a barra respeitando o limite físico visual de 100%
            setTimeout(() => {
                document.querySelectorAll('.progress-bar').forEach(bar => {
                    bar.style.width = bar.getAttribute('data-target-width');
                });
            }, 100);

            document.getElementById('init-loader').style.display = 'none';
        }

        // Função de Geração de Cartão com Pipeline
        function gerarHtmlCartao(classeNome, itemNome, subitemNome, realDia, realMes, metaMes, percentual, pQuente, pMorno, pFrio, formatador, sufixo) {
            const tituloFinal = subitemNome ? `${subitemNome} <span class="prod-subitem-badge">Subitem de ${itemNome}</span>` : itemNome;
            const totalPipe = pQuente + pMorno + pFrio;
            
            // Trava visual da barra: ela nunca passa de 100% para não quebrar a tela, mas o texto % mostra o real
            const larguraVisual = Math.min(percentual, 100);

            return `
                <div class="prod-card">
                    <div class="prod-classe">${classeNome}</div>
                    <div class="prod-item">${tituloFinal}</div>
                    
                    <div class="prod-stats">
                        <div class="stat-box">
                            <span class="stat-label">Real Dia</span>
                            <span class="stat-val">${formatador.format(realDia)}${sufixo}</span>
                        </div>
                        <div class="stat-box highlight">
                            <span class="stat-label">Real Mês</span>
                            <span class="stat-val">${formatador.format(realMes)}${sufixo}</span>
                        </div>
                        <div class="stat-box" style="border-color: #333; opacity: 0.8;">
                            <span class="stat-label">Meta Mês</span>
                            <span class="stat-val">${formatador.format(metaMes)}${sufixo}</span>
                        </div>
                    </div>

                    <div class="progress-container">
                        <div class="progress-bar" style="width: 0%;" data-target-width="${larguraVisual}%"></div>
                    </div>
                    <!-- Mostra o percentual real, sem limite, logo abaixo da barra -->
                    <div class="progress-text">${percentual.toFixed(1)}% atingido do mês</div>

                    <div class="pipe-section">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <span style="font-size: 0.75rem; color: var(--muted); text-transform: uppercase;">Pipeline (Mês)</span>
                            <span style="font-size: 0.85rem; font-weight: bold; color: #fff;">Total: ${formatador.format(totalPipe)}${sufixo}</span>
                        </div>
                        <div class="prod-stats" style="margin-bottom: 0;">
                            <div class="stat-box" style="border-left: 3px solid #ff4444; background: #1a0a0a;">
                                <span class="stat-label">Quente</span>
                                <span class="stat-val" style="font-size: 0.85rem;">${formatador.format(pQuente)}${sufixo}</span>
                            </div>
                            <div class="stat-box" style="border-left: 3px solid #ffbb33; background: #1a150a;">
                                <span class="stat-label">Morno</span>
                                <span class="stat-val" style="font-size: 0.85rem;">${formatador.format(pMorno)}${sufixo}</span>
                            </div>
                            <div class="stat-box" style="border-left: 3px solid #33b5e5; background: #0a151a;">
                                <span class="stat-label">Frio</span>
                                <span class="stat-val" style="font-size: 0.85rem;">${formatador.format(pFrio)}${sufixo}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- RESTANTE DO CÓDIGO (Igual) ---
        async function carregarCatalogoDoBanco() {
            const selectClasse = document.getElementById('form-classe');
            const { data } = await supabaseClient.from('tv_catalogo_classes').select(`id, nome, opcoes_status, tv_catalogo_itens (id, nome, tipo_medida, tv_catalogo_subitens (id, nome))`).eq('grupo_id', sessaoAtual.grupo_id);
            if (!data) return;

            data.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
            data.forEach(cls => { if (cls.tv_catalogo_itens) { cls.tv_catalogo_itens.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')); cls.tv_catalogo_itens.forEach(item => { if (item.tv_catalogo_subitens) item.tv_catalogo_subitens.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')); }); } });

            catalogoCache = data;
            selectClasse.innerHTML = '<option value="" disabled selected>Selecione a Classe...</option>';
            catalogoCache.forEach((cls, index) => { selectClasse.innerHTML += `<option value="${index}">${cls.nome}</option>`; });
        }

        function abrirLancamento() {
            document.getElementById('sheet-overlay').style.display = 'block';
            setTimeout(() => { document.getElementById('sheet-overlay').style.opacity = '1'; document.getElementById('sheet-lancamento').style.bottom = '0'; }, 10);
        }

        function fecharLancamento() {
            document.getElementById('sheet-lancamento').style.bottom = '-100%'; document.getElementById('sheet-overlay').style.opacity = '0';
            setTimeout(() => { document.getElementById('sheet-overlay').style.display = 'none'; }, 300);
            document.getElementById('form-producao').reset(); 
            document.getElementById('form-data-lancamento').value = document.getElementById('filtro-data').value;
            document.getElementById('box-pipeline').style.display = 'none'; document.getElementById('box-subitem').style.display = 'none';
            document.getElementById('form-item').disabled = true; document.getElementById('form-status').disabled = true;
        }

        function onClasseChange() {
            const classe = catalogoCache[document.getElementById('form-classe').value];
            const selectItem = document.getElementById('form-item');
            selectItem.disabled = false; selectItem.innerHTML = '<option value="" disabled selected>Selecione o Item...</option>';
            if (classe.tv_catalogo_itens) classe.tv_catalogo_itens.forEach((item, idx) => selectItem.innerHTML += `<option value="${idx}">${item.nome}</option>`);

            const selectStatus = document.getElementById('form-status');
            selectStatus.disabled = false; selectStatus.innerHTML = '<option value="" disabled selected>Selecione o Status...</option>';
            if (classe.opcoes_status) classe.opcoes_status.forEach(status => selectStatus.innerHTML += `<option value="${status}">${status}</option>`);

            document.getElementById('box-subitem').style.display = 'none'; document.getElementById('form-subitem').required = false;
            document.getElementById('box-pipeline').style.display = 'none'; document.getElementById('form-pipeline').required = false;
        }

        function onItemChange() {
            const item = catalogoCache[document.getElementById('form-classe').value].tv_catalogo_itens[document.getElementById('form-item').value];
            const inputValor = document.getElementById('form-valor');
            if (item.tipo_medida === 'quantidade') { document.getElementById('label-valor').innerText = 'Quantidade (Unidades)'; inputValor.placeholder = 'Ex: 1, 2, 5'; } 
            else { document.getElementById('label-valor').innerText = 'Valor (R$)'; inputValor.placeholder = 'Ex: 1500.00'; }

            const selectSubitem = document.getElementById('form-subitem');
            if (item.tv_catalogo_subitens && item.tv_catalogo_subitens.length > 0) {
                document.getElementById('box-subitem').style.display = 'block'; selectSubitem.required = true;
                selectSubitem.innerHTML = '<option value="" disabled selected>Selecione o Subitem...</option>';
                item.tv_catalogo_subitens.forEach(sub => selectSubitem.innerHTML += `<option value="${sub.nome}">${sub.nome}</option>`);
            } else {
                document.getElementById('box-subitem').style.display = 'none'; selectSubitem.required = false; selectSubitem.innerHTML = '<option value="">Nenhum</option>';
            }
        }

        function onStatusChange() {
            const statusBox = document.getElementById('form-status').value;
            const pipelineBox = document.getElementById('box-pipeline');
            if (statusBox.toLowerCase().includes('pipeline')) { pipelineBox.style.display = 'block'; document.getElementById('form-pipeline').required = true; } 
            else { pipelineBox.style.display = 'none'; document.getElementById('form-pipeline').required = false; }
        }

        document.getElementById('form-producao').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            document.getElementById('init-loader').style.display = 'flex';
            
            const classe = catalogoCache[document.getElementById('form-classe').value];
            const item = classe.tv_catalogo_itens[document.getElementById('form-item').value];
            const numDigitado = parseFloat(document.getElementById('form-valor').value) || 0;

            const payload = {
                utilizador_id: sessaoAtual.usuario_id, escritorio_id: sessaoAtual.escritorio_id, grupo_id: sessaoAtual.grupo_id,
                data_producao: document.getElementById('form-data-lancamento').value,
                classe_nome: classe.nome, item_nome: item.nome, subitem_nome: document.getElementById('box-subitem').style.display === 'block' ? document.getElementById('form-subitem').value : null,
                status: document.getElementById('form-status').value, pipeline: document.getElementById('box-pipeline').style.display === 'block' ? document.getElementById('form-pipeline').value : null,
                tipo_medida: item.tipo_medida, valor: item.tipo_medida === 'valor' ? numDigitado : 0, quantidade: item.tipo_medida === 'quantidade' ? numDigitado : 0
            };

            const { error } = await supabaseClient.from('tv_producao').insert([payload]);
            if (error) { Swal.fire('Erro!', error.message, 'error'); document.getElementById('init-loader').style.display = 'none'; } 
            else { 
                Swal.fire({ icon: 'success', title: 'Salvo!', showConfirmButton: false, timer: 1000, background: '#111', color: '#fff' });
                fecharLancamento(); carregarPainel(); 
            }
        });

        async function fazerLogoff() { document.getElementById('init-loader').style.display = 'flex'; await supabaseClient.auth.signOut(); window.location.href = 'login.html'; }
        validarSessao();
    </script>
</body>
</html>
