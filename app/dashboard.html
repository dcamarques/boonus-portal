<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boonus - App do Consultor</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --neon-color: #00ff88;
            --dark-bg: #050505;
            --panel-bg: #111;
            --card-bg: #1a1a1a;
            --text-color: #e0e0e0;
            --muted: #888;
            --border: #333;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: none; /* Trava anti-curiosos */
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }

        /* HEADER */
        .app-header {
            padding: 20px 20px 15px 20px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-greeting { font-size: 1.2rem; font-weight: bold; color: #fff; margin: 0; }
        .user-role { font-size: 0.75rem; color: var(--neon-color); text-transform: uppercase; letter-spacing: 1px; }
        
        /* MAIN SCROLLABLE AREA */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 90px; /* Espaço para o menu inferior */
        }

        .section-title { font-size: 0.9rem; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; margin-bottom: 15px; }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 15px; border-left: 4px solid var(--neon-color); }
        .card-value { font-size: 2rem; font-weight: bold; margin: 5px 0; color: #fff; }
        .card-label { font-size: 0.85rem; color: var(--muted); }

        /* BOTTOM NAVIGATION BAR */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: var(--panel-bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 25px 0; /* Padding extra para iPhones */
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.75rem;
            gap: 5px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .nav-item.active { color: var(--neon-color); }
        .nav-icon { font-size: 1.5rem; }

        .nav-fab {
            background: var(--neon-color);
            color: #000;
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.8rem;
            margin-top: -30px;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
        }

        /* BOTTOM SHEET (Modal de Lançamento) */
        .bottom-sheet-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            display: none;
            opacity: 0; transition: opacity 0.3s;
        }

        .bottom-sheet {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background: var(--panel-bg);
            border-radius: 20px 20px 0 0;
            z-index: 1000;
            padding: 20px;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh;
            overflow-y: auto;
            border-top: 2px solid var(--neon-color);
        }

        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sheet-title { margin: 0; font-size: 1.2rem; color: #fff; }
        .btn-close { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; }
        .input-group select, .input-group input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
            background: #1a1a1a; color: #fff; font-size: 1rem; appearance: none;
        }
        .input-group input:focus, .input-group select:focus { outline: none; border-color: var(--neon-color); }
        
        .btn-submit {
            width: 100%; padding: 15px; background: var(--neon-color); color: #000;
            border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem;
            margin-top: 10px; cursor: pointer; text-transform: uppercase;
        }

        /* Loader */
        #init-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid var(--neon-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="init-loader">
        <div class="spinner"></div>
        <div style="color: #888; font-size: 0.85rem; letter-spacing: 1px;">AUTENTICANDO...</div>
    </div>

    <!-- HEADER DO APP -->
    <header class="app-header">
        <div>
            <h1 class="user-greeting">Olá, <span id="user-name">...</span></h1>
            <div class="user-role" id="user-role">Consultor</div>
        </div>
        <div id="admin-icon" style="display: none; font-size: 1.5rem;">⚙️</div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main class="main-content">
        <div class="section-title">Minha Produção (Hoje)</div>
        
        <div class="card">
            <div class="card-label">Captação / Investimentos</div>
            <div class="card-value">R$ 0,00</div>
        </div>

        <div class="card" style="border-left-color: #00aaff;">
            <div class="card-label">Produtos / Contas</div>
            <div class="card-value">0 un.</div>
        </div>
        
        <div style="text-align: center; color: var(--muted); margin-top: 40px; font-size: 0.9rem;">
            Selecione ➕ abaixo para lançar produção.
        </div>
    </main>

    <!-- BARRA DE NAVEGAÇÃO INFERIOR (Mobile-First) -->
    <nav class="bottom-nav">
        <div class="nav-item active">
            <span class="nav-icon">📊</span>
            <span>Resumo</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">🎯</span>
            <span>Metas</span>
        </div>
        <!-- Botão Flutuante Central -->
        <div class="nav-item" onclick="abrirLancamento()">
            <div class="nav-fab">➕</div>
        </div>
        <div class="nav-item">
            <span class="nav-icon">🏆</span>
            <span>Ranking</span>
        </div>
        <div class="nav-item" onclick="fazerLogoff()">
            <span class="nav-icon">🚪</span>
            <span>Sair</span>
        </div>
    </nav>

    <!-- BOTTOM SHEET (Deslizante para Lançamento) -->
    <div class="bottom-sheet-overlay" id="sheet-overlay" onclick="fecharLancamento()"></div>
    <div class="bottom-sheet" id="sheet-lancamento">
        <div class="sheet-header">
            <h2 class="sheet-title">Novo Lançamento</h2>
            <button class="btn-close" onclick="fecharLancamento()">×</button>
        </div>

        <form id="form-producao">
            <div class="input-group">
                <label>Data da Produção</label>
                <input type="date" id="form-data" required>
            </div>

            <div class="input-group">
                <label>Classe</label>
                <select id="form-classe" required onchange="onClasseChange()">
                    <option value="" disabled selected>Selecione a Classe...</option>
                </select>
            </div>

            <div class="input-group">
                <label>Item</label>
                <select id="form-item" required disabled onchange="onItemChange()">
                    <option value="" disabled selected>Selecione a Classe primeiro...</option>
                </select>
            </div>

            <div class="input-group" id="box-subitem" style="display: none;">
                <label>Subitem (Opcional)</label>
                <select id="form-subitem">
                    <option value="">Nenhum</option>
                </select>
            </div>

            <div class="input-group">
                <label>Status</label>
                <select id="form-status" required disabled onchange="onStatusChange()">
                    <option value="" disabled selected>Aguardando Classe...</option>
                </select>
            </div>

            <div class="input-group" id="box-pipeline" style="display: none;">
                <label>Temperatura do Pipeline</label>
                <select id="form-pipeline">
                    <option value="Quente">Quente</option>
                    <option value="Morno">Morno</option>
                    <option value="Frio">Frio</option>
                </select>
            </div>

            <div class="input-group">
                <label id="label-valor">Quantidade / Valor</label>
                <input type="number" id="form-valor" required placeholder="0.00" step="0.01">
            </div>

            <button type="submit" class="btn-submit">Registrar Produção</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://vlnzhrhzzhbzdvhmsuap.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_fmqGGaxEPBatRTMzL5sTnw_FWrgvqr6'; 
        let supabaseClient;
        
        try { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } 
        catch (e) { console.error(e); }

        // Variável Global para segurar os IDs invisíveis (Segurança de Injeção)
        let sessaoAtual = {
            usuario_id: null,
            escritorio_id: null,
            grupo_id: null,
            nivel: 1
        };

        // 1. GUARDIÃO DE ROTA E CARREGAMENTO INICIAL
        async function validarSessao() {
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                if (error || !session) { window.location.href = 'login.html'; return; }

                sessaoAtual.usuario_id = session.user.id;
                
                // Pega os dados do consultor e os IDs estruturais (Grupo/Escritório)
                const { data: userDb } = await supabaseClient
                    .from('tv_utilizadores')
                    .select('nome_completo, perfil, nivel, escritorio_id, grupo_id')
                    .eq('id', session.user.id)
                    .single();

                if (userDb) {
                    document.getElementById('user-name').innerText = (userDb.nome_completo || session.user.email).split(' ')[0];
                    sessaoAtual.escritorio_id = userDb.escritorio_id;
                    sessaoAtual.grupo_id = userDb.grupo_id;
                    sessaoAtual.nivel = userDb.nivel || 1;
                    
                    if (userDb.nivel === 2) document.getElementById('user-role').innerText = 'Gestor de Escritório';
                    if (userDb.nivel === 3) {
                        document.getElementById('user-role').innerText = 'Sócio Diretor (Master)';
                        document.getElementById('admin-icon').style.display = 'block';
                    }
                }

                document.body.style.display = 'flex';
                document.getElementById('init-loader').style.display = 'none';

                // Preenche a data padrão do formulário como HOJE
                document.getElementById('form-data').valueAsDate = new Date();

            } catch (err) { window.location.href = 'login.html'; }
        }

        // 2. CONTROLE DO BOTTOM SHEET (Modal Mobile)
        const overlay = document.getElementById('sheet-overlay');
        const sheet = document.getElementById('sheet-lancamento');

        function abrirLancamento() {
            overlay.style.display = 'block';
            setTimeout(() => { 
                overlay.style.opacity = '1'; 
                sheet.style.bottom = '0'; 
            }, 10);
            carregarClassesCatalogo(); // Tenta puxar o catálogo do banco
        }

        function fecharLancamento() {
            sheet.style.bottom = '-100%';
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
            document.getElementById('form-producao').reset();
            document.getElementById('form-data').valueAsDate = new Date();
            document.getElementById('box-pipeline').style.display = 'none';
        }

        // 3. LÓGICA DO FORMULÁRIO EM CASCATA (Simulando o Catálogo Vazio)
        async function carregarClassesCatalogo() {
            const selectClasse = document.getElementById('form-classe');
            
            // Aqui ele tentará ler a tabela tv_catalogo_classes
            const { data: classes } = await supabaseClient
                .from('tv_catalogo_classes')
                .select('*')
                .eq('grupo_id', sessaoAtual.grupo_id);

            if (!classes || classes.length === 0) {
                selectClasse.innerHTML = '<option disabled selected>Catálogo Vazio (Avise o Gestor Nível 3)</option>';
                return;
            }

            // Futuro: Popular a cascata. Por enquanto, a interface avisa que o N3 precisa parametrizar as opções.
        }

        // 4. LÓGICA DE REATIVIDADE
        function onStatusChange() {
            const statusBox = document.getElementById('form-status');
            const pipelineBox = document.getElementById('box-pipeline');
            // Se o texto incluir "Pipeline", mostra o campo de temperatura
            if (statusBox.value && statusBox.value.toLowerCase().includes('pipeline')) {
                pipelineBox.style.display = 'block';
                document.getElementById('form-pipeline').required = true;
            } else {
                pipelineBox.style.display = 'none';
                document.getElementById('form-pipeline').required = false;
            }
        }

        // 5. SUBMISSÃO (MOCK DE AUDITORIA)
        document.getElementById('form-producao').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // O formulário travará aqui porque o Nível 3 ainda não cadastrou o catálogo
            Swal.fire({
                icon: 'info',
                title: 'Aviso de Estrutura',
                text: 'O formulário está pronto. Agora, o utilizador Nível 3 precisa aceder ao painel para registar as Classes e Itens antes de lançarmos a primeira produção.',
                background: '#111', color: '#fff', confirmButtonColor: '#00ff88'
            });
            fecharLancamento();
        });

        // 6. LOGOFF
        async function fazerLogoff() {
            document.getElementById('init-loader').style.display = 'flex';
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        validarSessao();
    </script>
</body>
</html>
