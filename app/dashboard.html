<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boonus - App do Consultor</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --neon-color: #00ff88; --dark-bg: #050505; --panel-bg: #111; --card-bg: #1a1a1a; --text-color: #e0e0e0; --muted: #888; --border: #333; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--dark-bg); color: var(--text-color); font-family: sans-serif; margin: 0; display: none; height: 100vh; overflow: hidden; flex-direction: column; }
        
        .app-header { padding: 20px; background: var(--panel-bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .user-greeting { font-size: 1.2rem; font-weight: bold; color: #fff; margin: 0; }
        .user-role { font-size: 0.75rem; color: var(--neon-color); text-transform: uppercase; }
        
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 90px; }
        .section-title { font-size: 0.9rem; text-transform: uppercase; color: var(--muted); margin-bottom: 15px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 15px; border-left: 4px solid var(--neon-color); }
        .card-value { font-size: 2rem; font-weight: bold; margin: 5px 0; color: #fff; }
        .card-label { font-size: 0.85rem; color: var(--muted); }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--panel-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 25px 0; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--muted); text-decoration: none; font-size: 0.75rem; gap: 5px; cursor: pointer; transition: color 0.3s; }
        .nav-item.active { color: var(--neon-color); }
        .nav-icon { font-size: 1.5rem; }
        .nav-fab { background: var(--neon-color); color: #000; width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; margin-top: -30px; box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4); }
        
        /* Modal Bottom Sheet */
        .bottom-sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; display: none; opacity: 0; transition: opacity 0.3s; }
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; background: var(--panel-bg); border-radius: 20px 20px 0 0; z-index: 1000; padding: 20px; transition: bottom 0.4s; max-height: 90vh; overflow-y: auto; border-top: 2px solid var(--neon-color); }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sheet-title { margin: 0; font-size: 1.2rem; color: #fff; }
        .btn-close { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; }
        .input-group select, .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #1a1a1a; color: #fff; font-size: 1rem; appearance: none; }
        .input-group select:disabled { opacity: 0.5; }
        .btn-submit { width: 100%; padding: 15px; background: var(--neon-color); color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; margin-top: 10px; cursor: pointer; text-transform: uppercase; }
        
        #init-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid var(--neon-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="init-loader"><div class="spinner"></div><div style="color: #888; font-size: 0.85rem; letter-spacing: 1px;">AUTENTICANDO...</div></div>
    
    <header class="app-header">
        <div>
            <h1 class="user-greeting">Olá, <span id="user-name">...</span></h1>
            <div class="user-role" id="user-role">Consultor</div>
        </div>
        <a href="admin-catalogo.html" id="admin-icon" style="display: none; font-size: 1.5rem; text-decoration: none;" title="Configurar Catálogo">⚙️</a>
    </header>

    <main class="main-content">
        <div class="section-title">Minha Produção (Hoje)</div>
        <div class="card">
            <div class="card-label">Captação / Investimentos</div>
            <div class="card-value">R$ 0,00</div>
        </div>
        <div class="card" style="border-left-color: #00aaff;">
            <div class="card-label">Produtos / Contas</div>
            <div class="card-value">0 un.</div>
        </div>
        <div style="text-align: center; color: var(--muted); margin-top: 40px; font-size: 0.9rem;">
            Selecione ➕ abaixo para lançar produção.
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active"><span class="nav-icon">📊</span><span>Resumo</span></div>
        <div class="nav-item"><span class="nav-icon">🎯</span><span>Metas</span></div>
        <div class="nav-item" onclick="abrirLancamento()"><div class="nav-fab">➕</div></div>
        <div class="nav-item"><span class="nav-icon">🏆</span><span>Ranking</span></div>
        <div class="nav-item" onclick="fazerLogoff()"><span class="nav-icon">🚪</span><span>Sair</span></div>
    </nav>

    <!-- FORMULÁRIO DE LANÇAMENTO (Cascata) -->
    <div class="bottom-sheet-overlay" id="sheet-overlay" onclick="fecharLancamento()"></div>
    <div class="bottom-sheet" id="sheet-lancamento">
        <div class="sheet-header">
            <h2 class="sheet-title">Novo Lançamento</h2>
            <button class="btn-close" onclick="fecharLancamento()">×</button>
        </div>
        
        <form id="form-producao">
            <div class="input-group">
                <label>Data</label>
                <input type="date" id="form-data" required>
            </div>
            
            <div class="input-group">
                <label>Classe</label>
                <select id="form-classe" required onchange="onClasseChange()">
                    <option value="" disabled selected>A carregar...</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Item</label>
                <select id="form-item" required disabled onchange="onItemChange()">
                    <option value="" disabled selected>Aguardando Classe...</option>
                </select>
            </div>
            
            <div class="input-group" id="box-subitem" style="display: none;">
                <label>Subitem</label>
                <select id="form-subitem">
                    <option value="">Nenhum</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Status</label>
                <select id="form-status" required disabled onchange="onStatusChange()">
                    <option value="" disabled selected>Aguardando Classe...</option>
                </select>
            </div>
            
            <div class="input-group" id="box-pipeline" style="display: none;">
                <label>Temperatura do Pipeline</label>
                <select id="form-pipeline">
                    <option value="Quente">Quente</option>
                    <option value="Morno">Morno</option>
                    <option value="Frio">Frio</option>
                </select>
            </div>
            
            <div class="input-group">
                <label id="label-valor">Valor / Qtd</label>
                <input type="number" id="form-valor" required placeholder="0.00" step="0.01">
            </div>
            
            <button type="submit" class="btn-submit">Registrar Produção</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://vlnzhrhzzhbzdvhmsuap.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_fmqGGaxEPBatRTMzL5sTnw_FWrgvqr6'; 
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let sessaoAtual = { usuario_id: null, escritorio_id: null, grupo_id: null, nivel: 1 };
        let catalogoCache = []; // Variável para guardar o catálogo e evitar consultas repetidas

        // 1. INICIALIZAÇÃO E SESSÃO
        async function validarSessao() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (error || !session) { window.location.href = 'login.html'; return; }
            
            sessaoAtual.usuario_id = session.user.id;
            const { data: userDb } = await supabaseClient.from('tv_utilizadores').select('nome_completo, perfil, nivel, escritorio_id, grupo_id').eq('id', session.user.id).single();
            
            if (userDb) {
                document.getElementById('user-name').innerText = (userDb.nome_completo || session.user.email).split(' ')[0];
                sessaoAtual.escritorio_id = userDb.escritorio_id; 
                sessaoAtual.grupo_id = userDb.grupo_id; 
                sessaoAtual.nivel = userDb.nivel || 1;
                
                if (userDb.nivel === 2) document.getElementById('user-role').innerText = 'Gestor de Escritório';
                if (userDb.nivel === 3) {
                    document.getElementById('user-role').innerText = 'Sócio Diretor (Master)';
                    document.getElementById('admin-icon').style.display = 'block';
                }
            }
            document.body.style.display = 'flex'; 
            document.getElementById('init-loader').style.display = 'none';
            document.getElementById('form-data').valueAsDate = new Date();
        }

        // 2. CONTROLO DO MODAL E BUSCA DO CATÁLOGO
        async function abrirLancamento() {
            document.getElementById('sheet-overlay').style.display = 'block';
            setTimeout(() => { document.getElementById('sheet-overlay').style.opacity = '1'; document.getElementById('sheet-lancamento').style.bottom = '0'; }, 10);
            
            if (catalogoCache.length === 0) {
                await carregarCatalogoDoBanco();
            }
        }

        function fecharLancamento() {
            document.getElementById('sheet-lancamento').style.bottom = '-100%'; document.getElementById('sheet-overlay').style.opacity = '0';
            setTimeout(() => { document.getElementById('sheet-overlay').style.display = 'none'; }, 300);
            document.getElementById('form-producao').reset(); 
            document.getElementById('form-data').valueAsDate = new Date(); 
            document.getElementById('box-pipeline').style.display = 'none';
            document.getElementById('box-subitem').style.display = 'none';
            document.getElementById('form-item').disabled = true;
            document.getElementById('form-status').disabled = true;
        }

        // 3. A LÓGICA DA CASCATA
        async function carregarCatalogoDoBanco() {
            const selectClasse = document.getElementById('form-classe');
            
            const { data, error } = await supabaseClient
                .from('tv_catalogo_classes')
                .select(`
                    id, nome, opcoes_status,
                    tv_catalogo_itens (
                        id, nome, tipo_medida,
                        tv_catalogo_subitens (id, nome)
                    )
                `)
                .eq('grupo_id', sessaoAtual.grupo_id);

            if (!data || data.length === 0) {
                selectClasse.innerHTML = '<option disabled selected>Catálogo Vazio (Avise o Gestor)</option>';
                return;
            }

            // Ordenação Alfabética Total
            data.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
            data.forEach(cls => {
                if (cls.tv_catalogo_itens) {
                    cls.tv_catalogo_itens.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
                    cls.tv_catalogo_itens.forEach(item => {
                        if (item.tv_catalogo_subitens) {
                            item.tv_catalogo_subitens.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
                        }
                    });
                }
            });

            catalogoCache = data;

            selectClasse.innerHTML = '<option value="" disabled selected>Selecione a Classe...</option>';
            catalogoCache.forEach((cls, index) => {
                selectClasse.innerHTML += `<option value="${index}">${cls.nome}</option>`;
            });
        }

        function onClasseChange() {
            const classIndex = document.getElementById('form-classe').value;
            const classe = catalogoCache[classIndex];
            
            // Popula Itens
            const selectItem = document.getElementById('form-item');
            selectItem.disabled = false;
            selectItem.innerHTML = '<option value="" disabled selected>Selecione o Item...</option>';
            if (classe.tv_catalogo_itens) {
                classe.tv_catalogo_itens.forEach((item, idx) => {
                    selectItem.innerHTML += `<option value="${idx}">${item.nome}</option>`;
                });
            }

            // Popula Status da Classe
            const selectStatus = document.getElementById('form-status');
            selectStatus.disabled = false;
            selectStatus.innerHTML = '<option value="" disabled selected>Selecione o Status...</option>';
            if (classe.opcoes_status) {
                classe.opcoes_status.forEach(status => {
                    selectStatus.innerHTML += `<option value="${status}">${status}</option>`;
                });
            }

            // Esconde subitem e pipeline ao trocar de classe
            document.getElementById('box-subitem').style.display = 'none';
            document.getElementById('form-subitem').required = false;
            document.getElementById('box-pipeline').style.display = 'none';
            document.getElementById('form-pipeline').required = false;
            document.getElementById('label-valor').innerText = 'Valor / Qtd';
        }

        function onItemChange() {
            const classIndex = document.getElementById('form-classe').value;
            const itemIndex = document.getElementById('form-item').value;
            const item = catalogoCache[classIndex].tv_catalogo_itens[itemIndex];

            // 1. Ajusta o Rótulo (Valor ou Quantidade)
            const labelValor = document.getElementById('label-valor');
            const inputValor = document.getElementById('form-valor');
            if (item.tipo_medida === 'quantidade') {
                labelValor.innerText = 'Quantidade (Unidades)';
                inputValor.placeholder = 'Ex: 1, 2, 5';
            } else {
                labelValor.innerText = 'Valor (R$)';
                inputValor.placeholder = 'Ex: 1500.00';
            }

            // 2. Verifica se existem Subitens
            const boxSubitem = document.getElementById('box-subitem');
            const selectSubitem = document.getElementById('form-subitem');
            
            if (item.tv_catalogo_subitens && item.tv_catalogo_subitens.length > 0) {
                boxSubitem.style.display = 'block';
                selectSubitem.required = true;
                selectSubitem.innerHTML = '<option value="" disabled selected>Selecione o Subitem...</option>';
                item.tv_catalogo_subitens.forEach(sub => {
                    selectSubitem.innerHTML += `<option value="${sub.id}">${sub.nome}</option>`;
                });
            } else {
                boxSubitem.style.display = 'none';
                selectSubitem.required = false;
                selectSubitem.innerHTML = '<option value="">Nenhum</option>';
            }
        }

        function onStatusChange() {
            const statusBox = document.getElementById('form-status').value;
            const pipelineBox = document.getElementById('box-pipeline');
            if (statusBox.toLowerCase().includes('pipeline')) { 
                pipelineBox.style.display = 'block'; 
                document.getElementById('form-pipeline').required = true; 
            } else { 
                pipelineBox.style.display = 'none'; 
                document.getElementById('form-pipeline').required = false; 
            }
        }

        // 4. SUBMISSÃO DO FORMULÁRIO (MOCK PARA O PRÓXIMO PASSO)
        document.getElementById('form-producao').addEventListener('submit', (e) => {
            e.preventDefault(); 
            Swal.fire({ 
                icon: 'success', 
                title: 'Tudo Conectado!', 
                text: 'Os dropdowns funcionaram perfeitamente e os dados estão prontos para serem gravados na tabela de produção.', 
                background: '#111', color: '#fff', confirmButtonColor: '#00ff88' 
            }); 
            fecharLancamento();
        });

        async function fazerLogoff() { document.getElementById('init-loader').style.display = 'flex'; await supabaseClient.auth.signOut(); window.location.href = 'login.html'; }
        
        validarSessao();
    </script>
</body>
</html>
