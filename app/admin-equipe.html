<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestão de Equipe e Escritórios - Boonus</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --neon-color: #00ff88;
            --dark-bg: #050505;
            --panel-bg: #111;
            --card-bg: #1a1a1a;
            --text-color: #e0e0e0;
            --muted: #888;
            --border: #333;
            --warn: #ffbb33;
            --danger: #ff4444;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }
        .app-header {
            padding: 18px 20px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title { margin: 0; font-size: 1.2rem; color: #fff; }
        .header-subtitle { font-size: 0.75rem; color: var(--neon-color); text-transform: uppercase; letter-spacing: 1px; }
        .btn-back {
            background: none; border: none; color: #fff; font-size: 1.8rem;
            cursor: pointer; padding: 0 10px 0 0; transition: color 0.2s;
        }
        .btn-back:hover { color: var(--neon-color); }

        .main-content { flex: 1; padding: 20px; max-width: 1100px; width: 100%; margin: 0 auto; }
        .grid-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 24px; }

        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 1rem; color: var(--neon-color); margin: 0 0 15px 0;
            text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid #333; padding-bottom: 10px;
        }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; }
        .input-group input, .input-group select {
            width: 100%; padding: 10px 12px; border-radius: 8px;
            border: 1px solid var(--border); background: #0a0a0a; color: #fff; font-size: 0.95rem;
        }

        .btn-primary {
            padding: 11px 16px; background: var(--neon-color); color: #000;
            border: none; border-radius: 8px; font-weight: bold; font-size: 0.85rem;
            cursor: pointer; text-transform: uppercase; transition: opacity 0.2s;
        }
        .btn-primary:hover { opacity: 0.85; }
        .btn-secondary {
            padding: 10px 14px; background: #222; color: #fff;
            border: 1px solid #444; border-radius: 8px; font-weight: bold;
            font-size: 0.85rem; cursor: pointer;
        }
        .btn-secondary:hover { border-color: var(--neon-color); }

        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .filters { display: flex; flex-wrap: wrap; gap: 10px; flex: 1; }
        .filters select, .filters input {
            padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
            background: #0a0a0a; color: #fff; font-size: 0.85rem;
        }

        .table-container { width: 100%; overflow-x: auto; border-radius: 8px; border: 1px solid #333; background: #0a0a0a; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .data-table th, .data-table td { padding: 12px; border-bottom: 1px solid #222; text-align: left; }
        .data-table th { background: #111; color: var(--muted); text-transform: uppercase; font-size: 0.72rem; }
        .data-table tr:hover { background: #151515; }

        .badge { padding: 3px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: bold; display: inline-block; }
        .badge-n1 { background: rgba(0, 255, 136, 0.15); color: var(--neon-color); border: 1px solid var(--neon-color); }
        .badge-n2 { background: rgba(255, 187, 51, 0.15); color: var(--warn); border: 1px solid var(--warn); }
        .badge-n3 { background: rgba(120, 180, 255, 0.15); color: #8ab8ff; border: 1px solid #5588dd; }
        .badge-ativo { background: rgba(0, 255, 136, 0.12); color: var(--neon-color); }
        .badge-inativo { background: rgba(255, 68, 68, 0.15); color: var(--danger); }

        .btn-edit {
            background: #222; color: #fff; border: 1px solid #444;
            padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
        }
        .btn-edit:hover { border-color: var(--neon-color); color: var(--neon-color); }

        .escritorio-chip {
            display: inline-flex; align-items: center; gap: 8px;
            background: #111; border: 1px solid #333; padding: 8px 12px;
            border-radius: 8px; margin: 0 8px 8px 0; font-size: 0.85rem;
        }

        #init-loader {
            position: fixed; inset: 0; background: var(--dark-bg);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #333;
            border-top: 4px solid var(--neon-color); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 12px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="init-loader">
        <div class="spinner"></div>
        <div style="color: #888; font-size: 0.85rem; letter-spacing: 1px;">CARREGANDO GESTÃO DE EQUIPE...</div>
    </div>

    <header class="app-header">
        <button class="btn-back" onclick="window.location.href='dashboard.html'" title="Voltar ao Dashboard">&#8592;</button>
        <div style="text-align: right;">
            <h1 class="header-title">Gestão de Equipe &amp; Escritórios</h1>
            <div class="header-subtitle">Nível 1 - Master</div>
        </div>
    </header>

    <main class="main-content">

        <div class="grid-top">
            <div class="section-box" style="margin-bottom: 0;">
                <h2 class="section-title">1. Meu Perfil (Master)</h2>
                <div class="input-group">
                    <label>Nome Completo</label>
                    <input type="text" id="perfil-nome">
                </div>
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="perfil-email" disabled style="opacity: 0.65;">
                </div>
                <div class="input-group">
                    <label>Telefone</label>
                    <input type="text" id="perfil-telefone" placeholder="(21) 99999-9999">
                </div>
                <div class="input-group">
                    <label>Cargo / Função</label>
                    <input type="text" id="perfil-cargo" placeholder="Ex: Sócio Diretor">
                </div>
                <button class="btn-primary" onclick="salvarMeuPerfil()">Salvar Meu Perfil</button>
            </div>

            <div class="section-box" style="margin-bottom: 0;">
                <h2 class="section-title">2. Meus Escritórios</h2>
                <div id="lista-escritorios" style="margin-bottom: 14px;"></div>

                <div class="input-group">
                    <label>Novo Escritório (Nome)</label>
                    <input type="text" id="novo-escritorio-nome" placeholder="Ex: Filial Centro / Unidade Niterói">
                </div>
                <div class="input-group">
                    <label>Identificador / CNPJ / Código (Opcional)</label>
                    <input type="text" id="novo-escritorio-doc" placeholder="Ex: 00.000.000/0001-00">
                </div>
                <button class="btn-secondary" style="width: 100%;" onclick="criarNovoEscritorio()">+ Adicionar Escritório</button>
            </div>
        </div>

        <div class="section-box">
            <div class="toolbar">
                <h2 class="section-title" style="margin: 0; border: none; padding: 0;">3. Usuários Cadastrados nos Meus Escritórios</h2>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="btn-secondary" onclick="abrirModalEnviarConvite()">✉️ Enviar Convite</button>
                    <button class="btn-primary" onclick="abrirModalNovoUsuario()">+ Cadastrar Membro</button>
                </div>
            </div>

            <div class="filters">
                <select id="filtro-escritorio" onchange="renderizarEquipe()">
                    <option value="todos">Todos os Meus Escritórios</option>
                </select>
                <select id="filtro-nivel" onchange="renderizarEquipe()">
                    <option value="todos">Todos os Níveis</option>
                    <option value="1">Nível 1 - Master</option>
                    <option value="2">Nível 2 - Responsável</option>
                    <option value="3">Nível 3 - Assessor</option>
                </select>
                <select id="filtro-status" onchange="renderizarEquipe()">
                    <option value="todos">Todos os Status</option>
                    <option value="ativo">Ativos</option>
                    <option value="inativo">Inativos</option>
                </select>
                <input type="text" id="filtro-busca" placeholder="Buscar por nome, cargo ou e-mail..." oninput="renderizarEquipe()" style="flex: 1; min-width: 180px;">
            </div>

            <div class="table-container" style="margin-top: 14px;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nome / E-mail</th>
                            <th>Escritório</th>
                            <th>Cargo</th>
                            <th>Nível</th>
                            <th>Status</th>
                            <th style="width: 90px;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-equipe"></tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://vlnzhrhzzhbzdvhmsuap.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_fmqGGaxEPBatRTMzL5sTnw_FWrgvqr6';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let masterAuthId = null;
        let sessionEmail = null;
        let meuPerfil = null;
        let escritoriosCache = [];
        let equipeCache = [];

        function esconderLoader() {
            const loader = document.getElementById('init-loader');
            if (loader) loader.style.display = 'none';
        }

        function mostrarLoader() {
            const loader = document.getElementById('init-loader');
            if (loader) loader.style.display = 'flex';
        }

        setTimeout(esconderLoader, 4000);

        async function iniciar() {
            try {
                const { data, error } = await supabaseClient.auth.getSession();
                const session = data ? data.session : null;
                if (error || !session) {
                    window.location.href = 'login.html';
                    return;
                }

                masterAuthId = session.user.id;
                sessionEmail = (session.user.email || '').toLowerCase();

                const perfil = await carregarMeuPerfilDoBanco();

                if (perfil && perfil.nivel_acesso !== undefined && perfil.nivel_acesso !== null && perfil.nivel_acesso !== 1 && perfil.nivel_acesso !== 0) {
                    esconderLoader();
                    alert("Acesso restrito ao usuário Master (Nível 1).");
                    window.location.href = 'dashboard.html';
                    return;
                }

                preencherFormularioPerfil();
                await carregarEscritorios();
                await carregarEquipe();
            } catch (err) {
                console.error('Erro ao iniciar gestão de equipe:', err);
            } finally {
                esconderLoader();
            }
        }

        async function carregarMeuPerfilDoBanco() {
            const { data, error } = await supabaseClient
                .from('ES_usuarios_perfis')
                .select('*')
                .eq('auth_id', masterAuthId)
                .limit(1);

            if (!error && data && data.length > 0) {
                meuPerfil = data[0];
                return meuPerfil;
            }

            const { data: inserido, error: errIns } = await supabaseClient
                .from('ES_usuarios_perfis')
                .insert([{
                    auth_id: masterAuthId,
                    email: sessionEmail,
                    nome: sessionEmail ? sessionEmail.split('@')[0] : 'Master',
                    cargo: 'Sócio Diretor',
                    nivel_acesso: 1,
                    ativo: true
                }])
                .select();

            if (!errIns && inserido && inserido.length > 0) {
                meuPerfil = inserido[0];
            }
            return meuPerfil;
        }

        function preencherFormularioPerfil() {
            document.getElementById('perfil-nome').value = meuPerfil && meuPerfil.nome ? meuPerfil.nome : '';
            document.getElementById('perfil-email').value = meuPerfil && meuPerfil.email ? meuPerfil.email : (sessionEmail || '');
            document.getElementById('perfil-telefone').value = meuPerfil && meuPerfil.telefone ? meuPerfil.telefone : '';
            document.getElementById('perfil-cargo').value = meuPerfil && meuPerfil.cargo ? meuPerfil.cargo : 'Sócio Diretor';
        }

        async function salvarMeuPerfil() {
            const nome = document.getElementById('perfil-nome').value.trim();
            const telefone = document.getElementById('perfil-telefone').value.trim();
            const cargo = document.getElementById('perfil-cargo').value.trim();

            if (!nome) {
                Swal.fire('Atenção', 'Informe o seu nome.', 'warning');
                return;
            }

            mostrarLoader();
            try {
                const payload = {
                    auth_id: masterAuthId,
                    email: (meuPerfil && meuPerfil.email) ? meuPerfil.email : sessionEmail,
                    nome: nome,
                    telefone: telefone,
                    cargo: cargo,
                    nivel_acesso: (meuPerfil && meuPerfil.nivel_acesso !== undefined && meuPerfil.nivel_acesso !== null) ? meuPerfil.nivel_acesso : 1,
                    escritorio_id: (meuPerfil && meuPerfil.escritorio_id) ? meuPerfil.escritorio_id : null,
                    ativo: meuPerfil ? meuPerfil.ativo !== false : true
                };

                const { data: salvo, error } = await supabaseClient
                    .from('ES_usuarios_perfis')
                    .upsert([payload], { onConflict: 'auth_id' })
                    .select();

                if (error || !salvo || salvo.length === 0) {
                    Swal.fire('Erro ao salvar', (error && error.message) ? error.message : 'Não foi possível confirmar a gravação no banco.', 'error');
                    return;
                }

                await carregarMeuPerfilDoBanco();
                preencherFormularioPerfil();
                await carregarEscritorios();
                await carregarEquipe();

                Swal.fire('Salvo!', 'Seu perfil foi gravado e atualizado.', 'success');
            } finally {
                esconderLoader();
            }
        }

        async function carregarEscritorios() {
            const { data: vinculos } = await supabaseClient
                .from('ES_master_escritorios')
                .select('escritorio_id')
                .eq('master_auth_id', masterAuthId);

            const ids = new Set((vinculos || []).map(v => v.escritorio_id).filter(Boolean));
            if (meuPerfil && meuPerfil.escritorio_id) ids.add(meuPerfil.escritorio_id);

            if (ids.size === 0) {
                escritoriosCache = [];
                renderizarEscritorios();
                return;
            }

            const { data: escritorios } = await supabaseClient
                .from('ES_escritorios')
                .select('*')
                .in('id', Array.from(ids))
                .order('nome', { ascending: true });

            escritoriosCache = escritorios || [];
            renderizarEscritorios();
        }

        function renderizarEscritorios() {
            const listaDiv = document.getElementById('lista-escritorios');
            const filtroEsc = document.getElementById('filtro-escritorio');
            const valorAtualFiltro = filtroEsc.value;

            listaDiv.innerHTML = '';
            filtroEsc.innerHTML = '<option value="todos">Todos os Meus Escritórios</option>';

            if (escritoriosCache.length === 0) {
                listaDiv.innerHTML = '<span style="color:#888; font-size:0.85rem;">Nenhum escritório vinculado ainda.</span>';
                return;
            }

            escritoriosCache.forEach(esc => {
                listaDiv.innerHTML += `
                    <div class="escritorio-chip">
                        <strong>${esc.nome}</strong>
                        <span style="color:#888; font-size:0.75rem;">${esc.ativo === false ? '(Inativo)' : '(Ativo)'}</span>
                        <button class="btn-edit" style="padding:3px 7px; font-size:0.72rem;" onclick="editarEscritorio('${esc.id}')">Editar</button>
                    </div>
                `;
                filtroEsc.innerHTML += `<option value="${esc.id}">${esc.nome}</option>`;
            });

            if (Array.from(filtroEsc.options).some(o => o.value === valorAtualFiltro)) {
                filtroEsc.value = valorAtualFiltro;
            }
        }

        async function criarNovoEscritorio() {
            const nome = document.getElementById('novo-escritorio-nome').value.trim();
            const doc = document.getElementById('novo-escritorio-doc').value.trim();

            if (!nome) {
                Swal.fire('Atenção', 'Informe o nome do novo escritório.', 'warning');
                return;
            }

            mostrarLoader();
            try {
                const { data: novoEsc, error } = await supabaseClient
                    .from('ES_escritorios')
                    .insert([{ nome: nome, documento: doc || null, ativo: true }])
                    .select();

                if (error || !novoEsc || novoEsc.length === 0) {
                    Swal.fire('Erro ao criar escritório', (error && error.message) ? error.message : 'Falha ao inserir escritório.', 'error');
                    return;
                }

                const escCriado = novoEsc[0];

                await supabaseClient
                    .from('ES_master_escritorios')
                    .insert([{ master_auth_id: masterAuthId, escritorio_id: escCriado.id }]);

                if (!meuPerfil || !meuPerfil.escritorio_id) {
                    await supabaseClient
                        .from('ES_usuarios_perfis')
                        .update({ escritorio_id: escCriado.id })
                        .eq('auth_id', masterAuthId);
                    await carregarMeuPerfilDoBanco();
                }

                document.getElementById('novo-escritorio-nome').value = '';
                document.getElementById('novo-escritorio-doc').value = '';
                await carregarEscritorios();
                await carregarEquipe();
                Swal.fire('Sucesso!', `Escritório "${nome}" criado e vinculado ao seu painel.`, 'success');
            } finally {
                esconderLoader();
            }
        }

        async function editarEscritorio(id) {
            const esc = escritoriosCache.find(e => e.id === id);
            if (!esc) return;

            const { value: formValues } = await Swal.fire({
                title: 'Editar Escritório',
                html: `
                    <div style="text-align:left; margin-bottom:10px;">
                        <label style="font-size:0.8rem; color:#aaa;">Nome do Escritório</label>
                        <input id="swal-esc-nome" class="swal2-input" value="${esc.nome || ''}" style="width:85%;">
                    </div>
                    <div style="text-align:left; margin-bottom:10px;">
                        <label style="font-size:0.8rem; color:#aaa;">Identificador / CNPJ</label>
                        <input id="swal-esc-doc" class="swal2-input" value="${esc.documento || ''}" style="width:85%;">
                    </div>
                    <div style="text-align:left;">
                        <label style="font-size:0.8rem; color:#aaa;">Status</label>
                        <select id="swal-esc-ativo" class="swal2-input" style="width:85%;">
                            <option value="true" ${esc.ativo !== false ? 'selected' : ''}>Ativo</option>
                            <option value="false" ${esc.ativo === false ? 'selected' : ''}>Inativo</option>
                        </select>
                    </div>
                `,
                background: '#111', color: '#fff', confirmButtonColor: '#00ff88',
                preConfirm: () => {
                    const nome = document.getElementById('swal-esc-nome').value.trim();
                    if (!nome) {
                        Swal.showValidationMessage('O nome é obrigatório');
                        return null;
                    }
                    return {
                        nome: nome,
                        documento: document.getElementById('swal-esc-doc').value.trim() || null,
                        ativo: document.getElementById('swal-esc-ativo').value === 'true'
                    };
                }
            });

            if (!formValues) return;

            const { error } = await supabaseClient
                .from('ES_escritorios')
                .update(formValues)
                .eq('id', id);

            if (error) {
                Swal.fire('Erro', error.message, 'error');
                return;
            }

            await carregarEscritorios();
            await carregarEquipe();
            Swal.fire('Atualizado!', 'Dados do escritório salvos.', 'success');
        }

        async function carregarEquipe() {
            const ids = escritoriosCache.map(e => e.id);
            let lista = [];

            if (ids.length > 0) {
                const { data, error } = await supabaseClient
                    .from('ES_usuarios_perfis')
                    .select('*')
                    .in('escritorio_id', ids)
                    .order('nome', { ascending: true });

                if (!error && data) lista = data;
            }

            if (meuPerfil && !lista.some(u => u.auth_id === meuPerfil.auth_id)) {
                lista.unshift(meuPerfil);
            }

            equipeCache = lista;
            renderizarEquipe();
        }

        function nomeEscritorio(id) {
            if (!id) return 'Sem escritório vinculado';
            const found = escritoriosCache.find(e => e.id === id);
            return found ? found.nome : 'Escritório não identificado';
        }

        function badgeNivel(nivel) {
            if (nivel === 0) return '<span class="badge badge-n1">Nível 0 - Executivo</span>';
            if (nivel === 1) return '<span class="badge badge-n1">Nível 1 - Master</span>';
            if (nivel === 2) return '<span class="badge badge-n2">Nível 2 - Responsável</span>';
            return '<span class="badge badge-n3">Nível 3 - Assessor</span>';
        }

        function renderizarEquipe() {
            const escFiltro = document.getElementById('filtro-escritorio').value;
            const nivelFiltro = document.getElementById('filtro-nivel').value;
            const statusFiltro = document.getElementById('filtro-status').value;
            const busca = document.getElementById('filtro-busca').value.trim().toLowerCase();
            const tbody = document.getElementById('tabela-equipe');

            const filtrados = equipeCache.filter(u => {
                if (escFiltro !== 'todos' && u.escritorio_id !== escFiltro) return false;
                if (nivelFiltro !== 'todos' && String(u.nivel_acesso) !== nivelFiltro) return false;
                const isAtivo = u.ativo !== false;
                if (statusFiltro === 'ativo' && !isAtivo) return false;
                if (statusFiltro === 'inativo' && isAtivo) return false;
                if (busca) {
                    const alvo = `${u.nome || ''} ${u.email || ''} ${u.cargo || ''}`.toLowerCase();
                    if (!alvo.includes(busca)) return false;
                }
                return true;
            });

            tbody.innerHTML = '';
            if (filtrados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#888; padding:24px;">Nenhum usuário encontrado com os filtros atuais.</td></tr>';
                return;
            }

            filtrados.forEach(u => {
                const isAtivo = u.ativo !== false;
                tbody.innerHTML += `
                    <tr>
                        <td>
                            <div style="font-weight:bold; color:#fff;">${u.nome || 'Sem nome'}</div>
                            <div style="font-size:0.78rem; color:#888;">${u.email || ''}</div>
                        </td>
                        <td>${nomeEscritorio(u.escritorio_id)}</td>
                        <td>${u.cargo || 'Assessor'}</td>
                        <td>${badgeNivel(u.nivel_acesso)}</td>
                        <td><span class="badge ${isAtivo ? 'badge-ativo' : 'badge-inativo'}">${isAtivo ? 'Ativo' : 'Inativo'}</span></td>
                        <td><button class="btn-edit" onclick="abrirModalEditarUsuario('${u.auth_id || u.id}')">✏️ Editar</button></td>
                    </tr>
                `;
            });
        }

        function optionsEscritorios(selecionadoId) {
            return escritoriosCache.map(e =>
                `<option value="${e.id}" ${e.id === selecionadoId ? 'selected' : ''}>${e.nome}</option>`
            ).join('');
        }

        async function abrirModalEnviarConvite() {
            if (escritoriosCache.length === 0) {
                Swal.fire('Atenção', 'Crie pelo menos um escritório antes de enviar convites.', 'warning');
                return;
            }

            const { value: formValues } = await Swal.fire({
                title: 'Enviar Convite de Escritório',
                html: `
                    <div style="text-align:left; margin-bottom:10px;">
                        <label style="font-size:0.8rem; color:#aaa;">E-mail do Convidado</label>
                        <input id="swal-conv-email" type="email" class="swal2-input" placeholder="convidado@email.com" style="width:85%;">
                    </div>
                    <div style="text-align:left; margin-bottom:10px;">
                        <label style="font-size:0.8rem; color:#aaa;">Cargo / Função Sugerida</label>
                        <input id="swal-conv-cargo" class="swal2-input" placeholder="Ex: Assessor de Investimentos" style="width:85%;">
                    </div>
                    <div style="text-align:left; margin-bottom:10px;">
                        <label style="font-size:0.8rem; color:#aaa;">Nível de Acesso do Convite</label>
                        <select id="swal-conv-nivel" class="swal2-input" style="width:85%;">
                            <option value="3" selected>Nível 3 - Assessor</option>
                            <option value="2">Nível 2 - Responsável</option>
                        </select>
                    </div>
                    <div style="text-align:left;">
                        <label style="font-size:0.8rem; color:#aaa;">Escritório</label>
                        <select id="swal-conv-esc" class="swal2-input" style="width:85%;">
                            ${optionsEscritorios(escritoriosCache[0].id)}
                        </select>
                    </div>
                `,
                background: '#111', color: '#fff', confirmButtonColor: '#00ff88',
                preConfirm: () => {
                    const email_convidado = document.getElementById('swal-conv-email').value.trim().toLowerCase();
                    if (!email_convidado) {
                        Swal.showValidationMessage('Informe o e-mail do convidado.');
                        return null;
                    }
                    return {
                        email_convidado: email_convidado,
                        cargo: document.getElementById('swal-conv-cargo').value.trim() || 'Assessor',
                        nivel_acesso: parseInt(document.getElementById('swal-conv-nivel').value, 10),
                        escritorio_id: document.getElementById('swal-conv-esc').value,
                        convidado_por: masterAuthId,
                        status: 'pendente'
                    };
                }
            });

            if (!formValues) return;

            const { error } = await supabaseClient
                .from('ES_convites')
                .insert([formValues]);

            if (error) {
                Swal.fire('Erro ao enviar convite', error.message, 'error');
                return;
            }

            Swal.fire('Convite enviado!', `O e-mail ${formValues.email_convidado} já poderá aceitar o convite no sistema.`, 'success');
        }

        async function abrirModalNovoUsuario() {
            if (escritoriosCache.length === 0) {
                Swal.fire('Atenção', 'Crie pelo menos um escritório antes de cadastrar membros.', 'warning');
                return;
            }

            const { value: formValues } = await Swal.fire({
                title: 'Cadastrar Membro na Equipe',
                html: `
                    <div style="text-align:left; margin-bottom:10px;">
                        <label style="font-size:0.8rem; color:#aaa;">Nome Completo</label>
                        <input id="swal-u-nome" class="swal2-input" placeholder="Nome do colaborador" style="width:85%;">
                    </div>
                    <div style="text-align:left; margin-bottom:10px;">
                        <label style="font-size:0.8rem; color:#aaa;">E-mail</label>
                        <input id="swal-u-email" type="email" class="swal2-input" placeholder="email@escritorio.com" style="width:85%;">
                    </div>
                    <div style="text-align:left; margin-bottom:10px;">
                        <label style="font-size:0.8rem; color:#aaa;">Telefone</label>
                        <input id="swal-u-tel" class="swal2-input" placeholder="(21) 99999-9999" style="width:85%;">
                    </div>
                    <div style="text-align:left; margin-bottom:10px;">
                        <label style="font-size:0.8rem; color:#aaa;">Cargo / Função</label>
                        <input id="swal-u-cargo" class="swal2-input" placeholder="Ex: Assessor de Investimentos, Gestor" style="width:85%;">
                    </div>
                    <div style="text-align:left; margin-bottom:10px;">
                        <label style="font-size:0.8rem; color:#aaa;">Nível Hierárquico</label>
                        <select id="swal-u-nivel" class="swal2-input" style="width:85%;">
                            <option value="3" selected>Nível 3 - Assessor</option>
                            <option value="2">Nível 2 - Responsável</option>
                            <option value="1">Nível 1 - Master</option>
                        </select>
                    </div>
                    <div style="text-align:left;">
                        <label style="font-size:0.8rem; color:#aaa;">Escritório</label>
                        <select id="swal-u-esc" class="swal2-input" style="width:85%;">
                            ${optionsEscritorios(escritoriosCache[0].id)}
                        </select>
                    </div>
                `,
                background: '#111', color: '#fff', confirmButtonColor: '#00ff88',
                preConfirm: () => {
                    const nome = document.getElementById('swal-u-nome').value.trim();
                    const email = document.getElementById('swal-u-email').value.trim().toLowerCase();
                    const telefone = document.getElementById('swal-u-tel').value.trim();
                    const cargo = document.getElementById('swal-u-cargo').value.trim() || 'Assessor';
                    const nivel_acesso = parseInt(document.getElementById('swal-u-nivel').value, 10);
                    const escritorio_id = document.getElementById('swal-u-esc').value;
                    if (!nome || !email) {
                        Swal.showValidationMessage('Nome e e-mail são obrigatórios.');
                        return null;
                    }
                    return { nome: nome, email: email, telefone: telefone, cargo: cargo, nivel_acesso: nivel_acesso, escritorio_id: escritorio_id, ativo: true };
                }
            });

            if (!formValues) return;

            const { error } = await supabaseClient
                .from('ES_usuarios_perfis')
                .insert([formValues]);

            if (error) {
                Swal.fire('Erro ao cadastrar', error.message, 'error');
                return;
            }

            await carregarEquipe();
            Swal.fire('Cadastrado!', 'Membro adicionado ao escritório.', 'success');
        }

        async function abrirModalEditarUsuario(chaveId) {
            const usuario = equipeCache.find(u => u.auth_id === chaveId || String(u.id) === String(chaveId));
            if (!usuario) return;

            const { value: formValues } = await Swal.fire({
                title: `Editar: ${usuario.nome || usuario.email}`,
                html: `
                    <div style="text-align:left; margin-bottom:10px;">
                        <label style="font-size:0.8rem; color:#aaa;">Nome Completo</label>
                        <input id="swal-ed-nome" class="swal2-input" value="${usuario.nome || ''}" style="width:85%;">
                    </div>
                    <div style="text-align:left; margin-bottom:10px;">
                        <label style="font-size:0.8rem; color:#aaa;">Telefone</label>
                        <input id="swal-ed-tel" class="swal2-input" value="${usuario.telefone || ''}" style="width:85%;">
                    </div>
                    <div style="text-align:left; margin-bottom:10px;">
                        <label style="font-size:0.8rem; color:#aaa;">Cargo / Função</label>
                        <input id="swal-ed-cargo" class="swal2-input" value="${usuario.cargo || ''}" style="width:85%;">
                    </div>
                    <div style="text-align:left; margin-bottom:10px;">
                        <label style="font-size:0.8rem; color:#aaa;">Nível Hierárquico (Upgrade / Downgrade)</label>
                        <select id="swal-ed-nivel" class="swal2-input" style="width:85%;">
                            <option value="1" ${usuario.nivel_acesso === 1 ? 'selected' : ''}>Nível 1 - Master</option>
                            <option value="2" ${usuario.nivel_acesso === 2 ? 'selected' : ''}>Nível 2 - Responsável</option>
                            <option value="3" ${usuario.nivel_acesso === 3 ? 'selected' : ''}>Nível 3 - Assessor</option>
                        </select>
                    </div>
                    <div style="text-align:left; margin-bottom:10px;">
                        <label style="font-size:0.8rem; color:#aaa;">Escritório</label>
                        <select id="swal-ed-esc" class="swal2-input" style="width:85%;">
                            ${optionsEscritorios(usuario.escritorio_id)}
                        </select>
                    </div>
                    <div style="text-align:left;">
                        <label style="font-size:0.8rem; color:#aaa;">Status de Acesso</label>
                        <select id="swal-ed-ativo" class="swal2-input" style="width:85%;">
                            <option value="true" ${usuario.ativo !== false ? 'selected' : ''}>Ativo</option>
                            <option value="false" ${usuario.ativo === false ? 'selected' : ''}>Inativo (Bloqueado sem perder histórico)</option>
                        </select>
                    </div>
                `,
                background: '#111', color: '#fff', confirmButtonColor: '#00ff88',
                preConfirm: () => {
                    const nome = document.getElementById('swal-ed-nome').value.trim();
                    if (!nome) {
                        Swal.showValidationMessage('O nome é obrigatório.');
                        return null;
                    }
                    return {
                        nome: nome,
                        telefone: document.getElementById('swal-ed-tel').value.trim(),
                        cargo: document.getElementById('swal-ed-cargo').value.trim() || 'Assessor',
                        nivel_acesso: parseInt(document.getElementById('swal-ed-nivel').value, 10),
                        escritorio_id: document.getElementById('swal-ed-esc').value,
                        ativo: document.getElementById('swal-ed-ativo').value === 'true'
                    };
                }
            });

            if (!formValues) return;

            const ehMeuPerfil = usuario.auth_id === masterAuthId;

            if (ehMeuPerfil && formValues.nivel_acesso !== 1) {
                const confirmSelf = await Swal.fire({
                    title: 'Atenção: Alterar seu próprio nível',
                    text: 'Você está removendo o próprio Nível 1 (Master) desta conta. Confirma?',
                    icon: 'warning', showCancelButton: true,
                    confirmButtonColor: '#ff4444', background: '#111', color: '#fff'
                });
                if (!confirmSelf.isConfirmed) return;
            }

            const query = usuario.auth_id
                ? supabaseClient.from('ES_usuarios_perfis').update(formValues).eq('auth_id', usuario.auth_id)
                : supabaseClient.from('ES_usuarios_perfis').update(formValues).eq('id', usuario.id);

            const { data: atualizado, error } = await query.select();

            if (error || !atualizado || atualizado.length === 0) {
                Swal.fire('Erro ao atualizar', (error && error.message) ? error.message : 'Não foi possível confirmar a alteração.', 'error');
                return;
            }

            if (ehMeuPerfil) {
                await carregarMeuPerfilDoBanco();
                preencherFormularioPerfil();
            }

            await carregarEquipe();
            Swal.fire('Atualizado!', 'Dados, cargo e nível hierárquico salvos.', 'success');
        }

        iniciar();
    </script>
</body>
</html>
